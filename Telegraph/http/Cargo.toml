[package]
name = "telegraph-http_server"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Telegraph HTTP server layer"
license.workspace = true

[dependencies]
# Internal crates
telegraph-domain = { path = "../domain" }
telegraph-application = { path = "../application" }

# HTTP framework
rustycog = { package = "rustycog-framework", version = "0.1.1", features = ["full"] }

# Axum and related dependencies
axum = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utility
uuid = { workspace = true }
chrono = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Async
async-trait = { workspace = true }
tokio = { workspace = true }

# Validation
axum-valid = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
mockall = { workspace = true }
rstest = { workspace = true } 