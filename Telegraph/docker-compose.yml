version: '3.8'

services:
  platform-mesh-certs:
    image: alpine:3.20
    volumes:
      - ../certs/platform-mesh:/certs
      - ../scripts/generate-platform-mesh-certs.sh:/generate-platform-mesh-certs.sh:ro
    command: ["sh", "-c", "apk add --no-cache openssl && sh /generate-platform-mesh-certs.sh"]

  localstack:
    image: localstack/localstack:3.0.2
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - DEBUG=1
      - SQS_ENDPOINT_STRATEGY=domain
      - SKIP_INFRA_DOWNLOADS=1
      - DISABLE_CORS_CHECKS=1
      - EAGER_SERVICE_LOADING=1
      - DATA_DIR=/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  telegraph-service:
    build:
      context: ..
      dockerfile: Telegraph/Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - RUST_ENVIRONMENT=development
    volumes:
      - ./config:/app/config
      - ../certs/platform-mesh:/app/certs
    depends_on:
      localstack:
        condition: service_healthy
      platform-mesh-certs:
        condition: service_completed_successfully 