[package]
name = "telegraph-setup"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Telegraph setup layer"
license.workspace = true

[dependencies]
# Internal crates
telegraph-domain = { path = "../domain" }
telegraph-application = { path = "../application" }
telegraph-infra = { path = "../infra" }
telegraph-http_server = { path = "../http" }
telegraph-configuration = { path = "../configuration" }

# RustyCog framework
rustycog = { package = "rustycog-framework", version = "0.1.1", features = ["full"] }

# HTTP and server
axum = { workspace = true }

# Serialization
serde = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Async
async-trait = { workspace = true }
tokio = { workspace = true } 