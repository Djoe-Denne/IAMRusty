# GitLab Connect - Development Configuration
#
# Targets the docker-compose stack. Host ports: 8086 HTTP / 8447 HTTPS.

[server]
host = "0.0.0.0"
port = 8080
tls_enabled = true
tls_port = 8443
tls_cert_path = "/app/certs/gitlab-connect-service.crt"
tls_key_path = "/app/certs/gitlab-connect-service.key"
tls_client_ca_path = "/app/certs/ca.crt"

[auth.jwt]
hs256_secret = "rustycog-dev-hs256-secret"
issuer = "iamrusty"
audience = "aiforall"

[logging]
level = "debug"

[gitlab]
client_id = "your-gitlab-client-id"
client_secret = "your-gitlab-client-secret"
auth_url = "https://gitlab.com/oauth/authorize"
token_url = "https://gitlab.com/oauth/token"
user_url = "https://gitlab.com/api/v4/user"
hmac_secret = "change-me-gitlab-connect-hmac"
redirect_uris = [
  "http://127.0.0.1:8080/iam/api/auth/gitlab/callback",
  "http://127.0.0.1:8080/iam/api/auth/gitlab/relink-callback",
]
