sonar.projectKey=Djoe-Denne_IAMRusty
sonar.organization=djoe-denne06

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=AIForAll
sonar.projectVersion=1.0

# Rust workspace analysis.
sonar.sources=.
sonar.inclusions=**/*.rs
sonar.exclusions=target/**,**/target/**,**/.git/**,lcov.info
# The in-process harness is gated by the TEST-ONLY test-harness feature.
sonar.coverage.exclusions=**/tests/**,**/fixtures/**,**/migration/src/**,**/infra/src/repository/entity/**,**/src/main.rs,**/setup/src/**,**/configuration/src/**,runtime/monolith/src/**,crates/iam-events/src/**,crates/hive-events/src/**,crates/manifesto-events/src/**,crates/apparatus-events/src/**,crates/apparatus-contracts/src/harness.rs
sonar.cpd.exclusions=**/tests/**,**/fixtures/**,**/migration/src/**,**/infra/src/repository/entity/**,**/src/main.rs,**/setup/src/**,**/configuration/src/**,runtime/monolith/src/**,crates/iam-events/src/**,crates/hive-events/src/**,crates/manifesto-events/src/**,crates/apparatus-events/src/**
sonar.rust.lcov.reportPaths=lcov.info

sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=target/sonar/clippy.json
