[package]
name = "hive-domain"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Domain layer for Hive organization management service"
license.workspace = true

[dependencies]
# Events
hive-events = { path = "../../hive-events" }

rustycog = { package = "rustycog-framework", version = "0.1.1", features = ["full"] }

# Async traits
async-trait = { workspace = true }

# Serialization
