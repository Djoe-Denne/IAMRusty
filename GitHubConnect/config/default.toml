# GitHub Connect default configuration (TOML)

[server]
host = "127.0.0.1"
port = 8080
tls_enabled = false
tls_cert_path = "./certs/cert.pem"
tls_key_path = "./certs/key.pem"
tls_port = 8443

[auth.jwt]
hs256_secret = "rustycog-dev-hs256-secret"
issuer = "iamrusty"
audience = "aiforall"

[logging]
level = "info"

[github]
client_id = "your-github-client-id"
client_secret = "your-github-client-secret"
auth_url = "https://github.com/login/oauth/authorize"
token_url = "https://github.com/login/oauth/access_token"
user_url = "https://api.github.com/user"
hmac_secret = "change-me-github-connect-hmac"
redirect_uris = [
  "http://127.0.0.1:8080/iam/api/auth/github/callback",
  "http://127.0.0.1:8080/iam/api/auth/github/relink-callback",
]
