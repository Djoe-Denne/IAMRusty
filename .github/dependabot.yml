version: 2
updates:
  # The root workspace owns the production lockfile. Do not update member
  # manifests separately or advance the RustyCog gitlink through this updater.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      cargo-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      actions-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ['*']
