name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The checked-in target-dir is the Windows development drive; never use it on Linux.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUST_BACKTRACE: 1
  RUN_ENV: test

jobs:
  fmt:
    name: Format
    needs: [plan]
    if: needs.plan.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - run: cargo fmt --all -- --check

  plan:
    name: Select conservative CI scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
      selection: ${{ steps.docs.outputs.selection || steps.scope.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - name: Admit Markdown-only PRs without Rust setup
        id: docs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.sha }}
        run: python3 -B ops/ci/pr_scope.py docs-only --base "$BASE_SHA" --head "$HEAD_SHA" --tested "$TESTED_SHA"
      - uses: ./.github/actions/setup-rust
        if: steps.docs.outputs.docs_only != 'true'
      - name: Plan the builds and integration suites to execute
        id: scope
        if: steps.docs.outputs.docs_only != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.sha }}
          SELECTIVE_PR: ${{ vars.CI_SELECTIVE_PR_TESTS }}
        run: |
          args=()
          if [[ -z "$SELECTIVE_PR" || "$SELECTIVE_PR" == 'true' ]]; then args+=(--execute-services); fi
          python3 -B ops/ci/pr_scope.py plan --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --tested "$TESTED_SHA" "${args[@]}"

  build-iam:
    name: Build (IAMRusty)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).build.iam
    runs-on: ubuntu-24.04
    env:
      # Server-side only: raw errors can contain scoped tokens/signed URLs.
      # Publish exclusively the allowlisted summary below, never this raw log.
      SCCACHE_LOG: sccache::server=debug,sccache::compiler::compiler=error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Configure private daemon log before cache startup
        run: echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/iam-sccache-private.log" >> "$GITHUB_ENV"
      - uses: ./.github/actions/build-service
        with:
          service: iam
          role: iam
      - name: Summarize compiler-cache backend errors without credentials
        if: always()
        run: >-
          python3 -B ops/ci/cache_diagnostics.py --log "$SCCACHE_ERROR_LOG"
          --output "$RUNNER_TEMP/iam-cache-diagnostics.json"
      - name: Retain sanitized IAM cache diagnostics only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iam-cache-diagnostics
          path: ${{ runner.temp }}/iam-cache-diagnostics.json
          if-no-files-found: error
          retention-days: 3

  build-telegraph:
    name: Build (Telegraph)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).build.telegraph
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: telegraph

  build-hive:
    name: Build (Hive)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).build.hive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: hive

  build-manifesto:
    name: Build (Manifesto)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).build.manifesto
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: manifesto

  build-monolith:
    name: Build (Monolith)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).build.monolith
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: monolith
          role: recovery

  build-sentinel:
    name: Build (Sentinel Sync)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).build['sentinel-sync']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: sentinel-sync

  build-ext-authz:
    name: Build (Ext Authz)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).build['ext-authz']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: ext-authz
          role: ext-authz

  build-oauth:
    name: Build (OAuthConnect)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).build.oauth
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: oauth
          role: oauth

  ext-authz-unit:
    name: Ext Authz (unit + HTTP Check stand-in, not Envoy proof)
    runs-on: ubuntu-latest
    needs: [fmt, plan, build-ext-authz]
    if: >-
      !cancelled() && needs.fmt.result == 'success' && needs.plan.result == 'success' &&
      fromJSON(needs.plan.outputs.selection).integration['ext-authz'] &&
      (needs.build-ext-authz.result == 'success' ||
      (needs.build-ext-authz.result == 'skipped' && !fromJSON(needs.plan.outputs.selection).build['ext-authz']))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-compiler-cache
      # Wiremock HTTP only: no Kind, Docker fixture or cloud credentials.
      - run: cargo test --locked --package ext-authz --lib --test mesh_path_standin --test registry_publication
      - uses: ./.github/actions/compiler-cache-stats

  infra-static:
    name: Infrastructure (offline render + shell syntax)
    needs: [plan]
    if: fromJSON(needs.plan.outputs.selection).full
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # kubectl is used only as an offline kustomize renderer; no cluster access.
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Install pinned Helm renderer (no cluster)
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/aiforall-helm-4.3.1"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz \
            --output "$tool_dir/helm-v4.3.1-linux-amd64.tar.gz"
          printf '%s  %s\n' \
            0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b \
            "$tool_dir/helm-v4.3.1-linux-amd64.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/helm-v4.3.1-linux-amd64.tar.gz" -C "$tool_dir" linux-amd64/helm
          "$tool_dir/linux-amd64/helm" version --short
          printf '%s\n' "$tool_dir/linux-amd64" >> "$GITHUB_PATH"
      - name: Install pinned just phase runner
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/aiforall-just-1.40.0"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            https://github.com/casey/just/releases/download/1.40.0/just-1.40.0-x86_64-unknown-linux-musl.tar.gz \
            --output "$tool_dir/just.tar.gz"
          printf '%s  %s\n' \
            181b91d0ceebe8a57723fb648ed2ce1a44d849438ce2e658339df4f8db5f1263 \
            "$tool_dir/just.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/just.tar.gz" -C "$tool_dir" just
          "$tool_dir/just" --version
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Check scripts and render deployment overlays
        run: bash ops/tests/infra-static.sh
      - name: Retained native Ops and target boundary regressions
        env:
          AIFORALL_IMAGE_REBUILD_PROOF: '0'
        run: python3 -B -m unittest discover -s ops/tests -p 'test_*.py' -v
      - name: Closed reusable-binary seam and CI fixture contracts (not E2E)
        run: |
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_binaries.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_workflows.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_cleanup.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_e2e.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_browser_audit.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_browser_container.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_campaign_browser.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_reporting.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_inputs.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_pki.py' -v

  apparatus-p0:
    name: Apparatus P0 (contracts + reference-kv)
    runs-on: ubuntu-latest
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-compiler-cache

      - name: Test apparatus-contracts (with test-harness)
        run: cargo test -p apparatus-contracts --features test-harness

      - name: Test apparatus-reference-kv
        run: cargo test -p apparatus-reference-kv
      - uses: ./.github/actions/compiler-cache-stats

  k6-e2e:
    name: E2E health / OAuth browser / TLS SAN
    needs: [build-iam, build-oauth, build-ext-authz]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/k6-e2e.yml

  e2e-pages-stage:
    name: Stage sanitized E2E report for Pages
    needs: [k6-e2e]
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.k6-e2e.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.current.outputs.publish }}
      artifact_id: ${{ steps.stage.outputs.artifact_id }}
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Skip staging for a stale commit or attempt
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_attempt')"
          if [ "$current" = "$GITHUB_SHA" ] && [ "$attempt" = "$GITHUB_RUN_ATTEMPT" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Download only the isolated public report from this run
        if: ${{ steps.current.outputs.publish == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: k6-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-site
      - name: Stage Pages report
        id: stage
        if: ${{ steps.current.outputs.publish == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-site

  e2e-pages:
    name: Publish sanitized E2E report
    needs: [e2e-pages-stage]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.e2e-pages-stage.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: e2e-github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # A separate staging job avoids the immediate upload/list race in deploy-pages (#451).
      - name: Wait for the exact Pages artifact to become visible
        id: visible
        if: ${{ needs.e2e-pages-stage.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.e2e-pages-stage.outputs.artifact_id }}
          STAGED_ATTEMPT: ${{ needs.e2e-pages-stage.outputs.attempt }}
        run: |
          if [[ "$STAGED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" || ! "$PAGES_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::No verified Pages artifact was staged in this run attempt.'
            exit 1
          fi
          for delay in 0 2 4 8 16; do
            if (( delay > 0 )); then sleep "$delay"; fi
            listed="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$PAGES_ARTIFACT_NAME" --jq '.artifacts[] | [.id, .name, .expired] | @tsv')"
            if [[ "$listed" == "$PAGES_ARTIFACT_ID"$'\t'"$PAGES_ARTIFACT_NAME"$'\tfalse' ]]; then
              echo "Pages artifact $PAGES_ARTIFACT_ID is visible."
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -n "$listed" ]]; then
              echo '::error::The Pages artifact is expired, ambiguous, or does not match the staged identity.'
              exit 1
            fi
            echo "Pages artifact $PAGES_ARTIFACT_ID is not visible yet."
          done
          echo '::error::The Pages artifact is still missing after five lookups.'
          exit 1
      - name: Verify master and attempt again before deployment
        id: current
        if: ${{ steps.visible.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_attempt')"
          if [ "$current" = "$GITHUB_SHA" ] && [ "$attempt" = "$GITHUB_RUN_ATTEMPT" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy public report and badge
        id: deployment
        if: ${{ steps.visible.outputs.ready == 'true' && steps.current.outputs.publish == 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

  test-iam:
    name: Coverage (IAMRusty)
    needs: [build-iam, plan, fmt]
    if: >-
      !cancelled() && needs.fmt.result == 'success' && needs.plan.result == 'success' &&
      fromJSON(needs.plan.outputs.selection).integration.iam &&
      (needs.build-iam.result == 'success' ||
      (needs.build-iam.result == 'skipped' && !fromJSON(needs.plan.outputs.selection).build.iam))
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: iam
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}
    secrets:
      # Qualify the same disposable fixture path on all PRs, including trusted PRs.
      IAMRUSTY_TEST_RSA8192_PEM_B64: ${{ github.event_name != 'pull_request' && secrets.IAMRUSTY_TEST_RSA8192_PEM_B64 || '' }}

  test-telegraph:
    name: Coverage (Telegraph)
    needs: [build-telegraph, plan, fmt]
    if: >-
      !cancelled() && needs.fmt.result == 'success' && needs.plan.result == 'success' &&
      fromJSON(needs.plan.outputs.selection).integration.telegraph &&
      (needs.build-telegraph.result == 'success' ||
      (needs.build-telegraph.result == 'skipped' && !fromJSON(needs.plan.outputs.selection).build.telegraph))
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: telegraph
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}

  test-hive:
    name: Coverage (Hive)
    needs: [build-hive, plan, fmt]
    if: >-
      !cancelled() && needs.fmt.result == 'success' && needs.plan.result == 'success' &&
      fromJSON(needs.plan.outputs.selection).integration.hive &&
      (needs.build-hive.result == 'success' ||
      (needs.build-hive.result == 'skipped' && !fromJSON(needs.plan.outputs.selection).build.hive))
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: hive
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}

  test-manifesto:
    name: Coverage (Manifesto)
    needs: [build-manifesto, plan, fmt]
    if: >-
      !cancelled() && needs.fmt.result == 'success' && needs.plan.result == 'success' &&
      fromJSON(needs.plan.outputs.selection).integration.manifesto &&
      (needs.build-manifesto.result == 'success' ||
      (needs.build-manifesto.result == 'skipped' && !fromJSON(needs.plan.outputs.selection).build.manifesto))
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: manifesto
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}

  test-sentinel:
    name: Coverage (Sentinel Sync)
    needs: [build-sentinel, plan, fmt]
    if: >-
      !cancelled() && needs.fmt.result == 'success' && needs.plan.result == 'success' &&
      fromJSON(needs.plan.outputs.selection).integration['sentinel-sync'] &&
      (needs.build-sentinel.result == 'success' ||
      (needs.build-sentinel.result == 'skipped' && !fromJSON(needs.plan.outputs.selection).build['sentinel-sync']))
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: sentinel-sync
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}

  test-readiness:
    name: Coverage (readiness)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).integration.readiness
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: readiness
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}

  test-shared:
    name: Coverage (Apparatus contracts)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).integration.shared
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: shared
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}

  merge-coverage:
    name: Merge coverage
    runs-on: ubuntu-24.04
    needs: [plan, test-iam, test-telegraph, test-hive, test-manifesto, test-sentinel, test-readiness, test-shared]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.selection).has_coverage }}
    timeout-minutes: 15
    outputs:
      authoritative: ${{ steps.merge.outputs.authoritative }}
      pr_ready: ${{ steps.merge.outputs.pr_ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: lcov-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Install LCOV tools
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu*' -delete
          # Bounded mirror connections: a stalled apt mirror (observed 6h hang
          # on azure.archive.ubuntu.com) must fail fast and let the healthy
          # mirrors serve the index instead of blocking until the job timeout.
          sudo apt-get update \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends lcov

      - name: Merge LCOV reports
        id: merge
        env:
          CI_EXECUTION_SCOPE: ${{ needs.plan.outputs.selection }}
        run: python3 -B ops/ci/pipeline.py aggregate --directory coverage-artifacts --output-directory coverage-merged

      - name: Upload merged coverage and explicit test outcomes for diagnosis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-diagnostic
          path: coverage-merged/diagnostic/
          if-no-files-found: error
          retention-days: 7

      - name: Upload authoritative coverage only after successful full execution
        if: steps.merge.outputs.authoritative == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: coverage-merged/authoritative/
          if-no-files-found: error
          retention-days: 7
      - name: Upload same-run coverage for the selected PR suites
        if: steps.merge.outputs.pr_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-selected-coverage
          path: coverage-merged/pr/
          if-no-files-found: error
          retention-days: 7

  clippy:
    name: Clippy (production and tests)
    runs-on: ubuntu-24.04
    needs: [fmt, plan]
    env:
      CI_EXECUTION_SCOPE: ${{ needs.plan.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-compiler-cache

      - name: Install native dependencies
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu*' -delete
          sudo apt-get update \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev

      - name: Run Clippy report (production vs tests)
        run: |
          mkdir -p target/sonar
          scope_args="$(python3 -B ops/ci/reports.py clippy-packages)"
          mapfile -t packages <<< "$scope_args"

          # Shared Clippy groups (stricter than workspace Cargo.toml defaults).
          common_clippy=(
            -W clippy::all
            -W clippy::pedantic
            -W clippy::nursery
            -W clippy::cargo
            -W clippy::todo
            -W clippy::unimplemented
            -A clippy::cargo_common_metadata
            -A clippy::multiple_crate_versions
          )

          # Production: lib, binaries, examples (not tests/, not #[cfg(test)] in lib).
          cargo clippy "${packages[@]}" --locked --all-features --lib --bins --examples --message-format=json -- \
            "${common_clippy[@]}" \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -W clippy::panic \
            > target/sonar/clippy-production.jsonl

          # Tests and benches: same groups, but allow unwrap/expect/panic where typical for tests.
          cargo clippy "${packages[@]}" --locked --all-features --tests --benches --message-format=json -- \
            "${common_clippy[@]}" \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::panic \
            > target/sonar/clippy-tests.jsonl

          # One report for Sonar (newline-delimited JSON). Possible duplicate lines for lib if
          # the tests pass also type-checks the same crate; Sonar usually dedupes by rule + location.
          cat target/sonar/clippy-production.jsonl target/sonar/clippy-tests.jsonl > target/sonar/clippy.json

      - name: Validate fresh complete compiler reports and record provenance
        run: python3 -B ops/ci/reports.py clippy-create --directory target/sonar
      - name: Publish complete Clippy import
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clippy
          path: target/sonar/
          if-no-files-found: error
          retention-days: 7
      - uses: ./.github/actions/compiler-cache-stats

  sonar:
    name: SonarCloud
    runs-on: ubuntu-24.04
    needs: [merge-coverage, clippy, plan]
    if: >-
      needs.merge-coverage.outputs.authoritative == 'true' ||
      (github.event_name == 'pull_request' && needs.merge-coverage.outputs.pr_ready == 'true')
    outputs:
      scan_outcome: ${{ steps.scan.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Download qualified coverage for this scope
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.merge-coverage.outputs.authoritative == 'true' && 'lcov' || 'pr-selected-coverage' }}
          path: .
      - name: Download independently generated Clippy reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: clippy
          path: target/sonar
      - name: Admit only complete current-source reports for the selected scope
        env:
          CI_EXECUTION_SCOPE: ${{ needs.plan.outputs.selection }}
        run: |
          python3 -B ops/ci/pipeline.py verify-merged --directory .
          python3 -B ops/ci/reports.py clippy-verify --directory target/sonar
      - name: Report same-run coverage and Clippy on changed code
        id: pr-quality
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.sha }}
          CI_EXECUTION_SCOPE: ${{ needs.plan.outputs.selection }}
        run: python3 -B ops/ci/pr_scope.py quality --base "$BASE_SHA" --head "$HEAD_SHA" --tested "$TESTED_SHA"
      - name: Publish PR quality evidence
        if: steps.pr-quality.outputs.report_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-quality
          path: |
            target/sonar/pr-quality.json
            target/sonar/clippy-pr.json
          if-no-files-found: error
          retention-days: 7
      - name: Check out the identical PR source tree for Sonar
        id: pr-source
        if: >-
          steps.pr-quality.outputs.head_compatible == 'true' &&
          steps.pr-quality.outputs.coverage_compatible == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git checkout --detach "$HEAD_SHA"
      - name: SonarCloud scan
        id: scan
        if: github.event_name != 'pull_request' || steps.pr-source.outcome == 'success'
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' && 'true' || 'false' }}
            -Dsonar.rust.lcov.reportPaths=lcov.info
            -Dsonar.rust.clippyReport.reportPaths=${{ github.event_name != 'pull_request' && 'target/sonar/clippy.json' || (steps.pr-quality.outputs.has_clippy == 'true' && 'target/sonar/clippy-pr.json' || '') }}

  ci-status:
    name: CI scope and result
    if: always()
    runs-on: ubuntu-24.04
    needs: [fmt, plan, infra-static, build-iam, build-telegraph, build-hive, build-manifesto, build-monolith, build-sentinel, build-ext-authz, build-oauth, ext-authz-unit, apparatus-p0, test-iam, test-telegraph, test-hive, test-manifesto, test-sentinel, test-readiness, test-shared, clippy, merge-coverage, sonar, k6-e2e, e2e-pages-stage, e2e-pages]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Distinguish selected failures from intentional skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
        run: python3 -B ops/ci/reports.py status
