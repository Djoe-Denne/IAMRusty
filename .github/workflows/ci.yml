name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The checked-in target-dir is the Windows development drive; never use it on Linux.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUST_BACKTRACE: 1
  RUN_ENV: test

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-rust

      - run: cargo fmt --all -- --check

  plan:
    name: Select conservative CI scope
    runs-on: ubuntu-24.04
    outputs:
      selection: ${{ steps.scope.outputs.selection }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Plan full coverage unless selective PR execution was explicitly enabled
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELECTIVE_PR: ${{ vars.CI_SELECTIVE_PR_TESTS }}
        run: |
          args=()
          if [[ "$SELECTIVE_PR" == 'true' ]]; then args+=(--selective); fi
          python3 -B ops/ci/pipeline.py select --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" "${args[@]}"

  build-iam:
    name: Build (IAMRusty)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).iam
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: iam
          role: iam

  build-telegraph:
    name: Build (Telegraph)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).telegraph
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: telegraph

  build-hive:
    name: Build (Hive)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).hive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: hive

  build-manifesto:
    name: Build (Manifesto)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).manifesto
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: manifesto

  build-monolith:
    name: Build (Monolith)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).monolith
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: monolith

  build-sentinel:
    name: Build (Sentinel Sync)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection)['sentinel-sync']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: sentinel-sync

  build-ext-authz:
    name: Build (Ext Authz)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection)['ext-authz']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: ext-authz
          role: ext-authz

  build-oauth:
    name: Build (OAuthConnect)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).oauth
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: oauth
          role: oauth

  ext-authz-unit:
    name: Ext Authz (unit + HTTP Check stand-in, not Envoy proof)
    runs-on: ubuntu-latest
    needs: [build-ext-authz]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-compiler-cache
      # Wiremock HTTP only: no Kind, Docker fixture or cloud credentials.
      - run: cargo test --locked --package ext-authz --lib --test mesh_path_standin --test registry_publication
      - uses: ./.github/actions/compiler-cache-stats

  infra-static:
    name: Infrastructure (offline render + shell syntax)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # kubectl is used only as an offline kustomize renderer; no cluster access.
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Install pinned Helm renderer (no cluster)
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/aiforall-helm-4.3.1"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz \
            --output "$tool_dir/helm-v4.3.1-linux-amd64.tar.gz"
          printf '%s  %s\n' \
            0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b \
            "$tool_dir/helm-v4.3.1-linux-amd64.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/helm-v4.3.1-linux-amd64.tar.gz" -C "$tool_dir" linux-amd64/helm
          "$tool_dir/linux-amd64/helm" version --short
          printf '%s\n' "$tool_dir/linux-amd64" >> "$GITHUB_PATH"
      - name: Install pinned just phase runner
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/aiforall-just-1.40.0"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            https://github.com/casey/just/releases/download/1.40.0/just-1.40.0-x86_64-unknown-linux-musl.tar.gz \
            --output "$tool_dir/just.tar.gz"
          printf '%s  %s\n' \
            181b91d0ceebe8a57723fb648ed2ce1a44d849438ce2e658339df4f8db5f1263 \
            "$tool_dir/just.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/just.tar.gz" -C "$tool_dir" just
          "$tool_dir/just" --version
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Check scripts and render deployment overlays
        run: bash ops/tests/infra-static.sh
      - name: Retained native Ops and target boundary regressions
        env:
          AIFORALL_IMAGE_REBUILD_PROOF: '0'
        run: python3 -B -m unittest discover -s ops/tests -p 'test_*.py' -v
      - name: Closed reusable-binary seam and CI fixture contracts (not E2E)
        run: |
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_binaries.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_workflows.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_cleanup.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_e2e.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_browser_audit.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_browser_container.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_campaign_browser.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_reporting.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_inputs.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_render.py' -v
          python3 -B -m unittest discover -s ops/tests/k6/tests -p 'test_ci_pki.py' -v

  apparatus-p0:
    name: Apparatus P0 (contracts + reference-kv)
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-compiler-cache

      - name: Test apparatus-contracts (with test-harness)
        run: cargo test -p apparatus-contracts --features test-harness

      - name: Test apparatus-reference-kv
        run: cargo test -p apparatus-reference-kv
      - uses: ./.github/actions/compiler-cache-stats

  k6-e2e:
    name: E2E health / OAuth browser / TLS SAN
    needs: [build-iam, build-oauth, build-ext-authz]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/k6-e2e.yml

  e2e-pages:
    name: Publish sanitized E2E report
    needs: [k6-e2e]
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.k6-e2e.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: e2e-github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Never replace current reports with a stale commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_attempt')"
          if [ "$current" = "$GITHUB_SHA" ] && [ "$attempt" = "$GITHUB_RUN_ATTEMPT" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Download only the isolated public report from this run
        if: ${{ steps.current.outputs.publish == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: k6-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-site
      - name: Stage Pages report
        if: ${{ steps.current.outputs.publish == 'true' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/e2e-site
      - name: Deploy public report and badge
        id: deployment
        if: ${{ steps.current.outputs.publish == 'true' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  test-iam:
    name: Coverage (IAMRusty)
    needs: [build-iam, plan]
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: iam
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}
    secrets:
      IAMRUSTY_TEST_RSA8192_PEM_B64: ${{ secrets.IAMRUSTY_TEST_RSA8192_PEM_B64 }}

  test-telegraph:
    name: Coverage (Telegraph)
    needs: [build-telegraph, plan]
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: telegraph
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}

  test-hive:
    name: Coverage (Hive)
    needs: [build-hive, plan]
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: hive
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}

  test-manifesto:
    name: Coverage (Manifesto)
    needs: [build-manifesto, plan]
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: manifesto
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}

  test-sentinel:
    name: Coverage (Sentinel Sync)
    needs: [build-sentinel, plan]
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: sentinel-sync
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}

  test-readiness:
    name: Coverage (readiness)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).readiness
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: readiness
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}

  test-shared:
    name: Coverage (Apparatus contracts)
    needs: [fmt, plan]
    if: fromJSON(needs.plan.outputs.selection).shared
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: shared
      scope: ${{ fromJSON(needs.plan.outputs.selection).full && 'full' || 'partial' }}

  merge-coverage:
    name: Merge coverage
    runs-on: ubuntu-24.04
    needs: [plan, test-iam, test-telegraph, test-hive, test-manifesto, test-sentinel, test-readiness, test-shared]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.selection).full }}
    timeout-minutes: 15
    outputs:
      authoritative: ${{ steps.merge.outputs.authoritative }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: lcov-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Install LCOV tools
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu*' -delete
          # Bounded mirror connections: a stalled apt mirror (observed 6h hang
          # on azure.archive.ubuntu.com) must fail fast and let the healthy
          # mirrors serve the index instead of blocking until the job timeout.
          sudo apt-get update \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends lcov

      - name: Merge LCOV reports
        id: merge
        run: python3 -B ops/ci/pipeline.py aggregate --directory coverage-artifacts --output-directory coverage-merged

      - name: Upload merged coverage and explicit test outcomes for diagnosis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-diagnostic
          path: coverage-merged/diagnostic/
          if-no-files-found: error
          retention-days: 7

      - name: Upload authoritative coverage only after successful full execution
        if: steps.merge.outputs.authoritative == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: coverage-merged/authoritative/
          if-no-files-found: error
          retention-days: 7

  clippy:
    name: Clippy (production and tests)
    runs-on: ubuntu-24.04
    needs: [fmt]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-compiler-cache

      - name: Install native dependencies
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu*' -delete
          sudo apt-get update \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev

      - name: Run Clippy report (production vs tests)
        run: |
          mkdir -p target/sonar

          # Shared Clippy groups (stricter than workspace Cargo.toml defaults).
          common_clippy=(
            -W clippy::all
            -W clippy::pedantic
            -W clippy::nursery
            -W clippy::cargo
            -W clippy::todo
            -W clippy::unimplemented
            -A clippy::cargo_common_metadata
            -A clippy::multiple_crate_versions
          )

          # Production: lib, binaries, examples (not tests/, not #[cfg(test)] in lib).
          cargo clippy --workspace --locked --all-features --lib --bins --examples --message-format=json -- \
            "${common_clippy[@]}" \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -W clippy::panic \
            > target/sonar/clippy-production.jsonl

          # Tests and benches: same groups, but allow unwrap/expect/panic where typical for tests.
          cargo clippy --workspace --locked --all-features --tests --benches --message-format=json -- \
            "${common_clippy[@]}" \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::panic \
            > target/sonar/clippy-tests.jsonl

          # One report for Sonar (newline-delimited JSON). Possible duplicate lines for lib if
          # the tests pass also type-checks the same crate; Sonar usually dedupes by rule + location.
          cat target/sonar/clippy-production.jsonl target/sonar/clippy-tests.jsonl > target/sonar/clippy.json

      - name: Validate fresh complete compiler reports and record provenance
        run: python3 -B ops/ci/reports.py clippy-create --directory target/sonar
      - name: Publish complete Clippy import
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clippy
          path: target/sonar/
          if-no-files-found: error
          retention-days: 7
      - uses: ./.github/actions/compiler-cache-stats

  sonar:
    name: SonarCloud
    runs-on: ubuntu-24.04
    needs: [merge-coverage, clippy]
    if: needs.merge-coverage.outputs.authoritative == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Download complete coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lcov
          path: .
      - name: Download independently generated Clippy reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: clippy
          path: target/sonar
      - name: Admit only complete current-source reports
        run: |
          python3 -B ops/ci/pipeline.py verify-merged --directory .
          python3 -B ops/ci/reports.py clippy-verify --directory target/sonar
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.rust.lcov.reportPaths=lcov.info

  ci-status:
    name: CI scope and result
    if: always()
    runs-on: ubuntu-24.04
    needs: [fmt, plan, infra-static, build-iam, build-telegraph, build-hive, build-manifesto, build-monolith, build-sentinel, build-ext-authz, build-oauth, ext-authz-unit, apparatus-p0, test-iam, test-telegraph, test-hive, test-manifesto, test-sentinel, test-readiness, test-shared, clippy, merge-coverage, sonar, k6-e2e, e2e-pages]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Distinguish selected failures from intentional skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
        run: python3 -B ops/ci/reports.py status
