name: CodeQL automation

# Independent of the Rust lane: changes to Cargo sources alone do not start
# runners for Python and JavaScript.
on:
  pull_request:
    branches: [master]
    paths:
      - '**/*.py'
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.cts'
      - '**/*.mts'
      - '!.agents/**'
      - '!docs/**'
      - '!obsidian/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql-automation.yml'
  push:
    branches: [master]
    paths:
      - '**/*.py'
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.cts'
      - '**/*.mts'
      - '!.agents/**'
      - '!docs/**'
      - '!obsidian/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql-automation.yml'
  schedule:
    - cron: '43 3 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-automation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          tools: linked
          config-file: ./.github/codeql/config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload-database: false
