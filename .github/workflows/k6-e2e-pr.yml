name: Opt-in k6 E2E qualification for harness PRs

on:
  pull_request:
    types: [labeled]
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  e2e:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.label.name, 'k6-e2e:')
    uses: ./.github/workflows/k6-e2e.yml
    with:
      pr_qualification: true
