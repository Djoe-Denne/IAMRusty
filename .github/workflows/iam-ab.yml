name: IAM CI A/B benchmark
on:
  push:
    branches: [ci-iam-ab]

permissions:
  contents: read
  actions: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RUST_BACKTRACE: '1'
  RUN_ENV: test

jobs:
  build-a:
    name: A native IAM
    if: github.repository == 'Djoe-Denne/IAMRusty'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: iam
      - name: Bundle native IAM and migration for A
        run: >-
          python3 -B ops/ci/iam_compile_once.py benchmark-native --part native-e2e
          --output "$RUNNER_TEMP/iam-ab-a-native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-ab-a-native-e2e-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-ab-a-native/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  build-b:
    name: B instrumented IAM and tests
    if: github.repository == 'Djoe-Denne/IAMRusty'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-compiler-cache
      - uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install IAM native dependencies
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu*' -delete
          sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Freeze instrumented IAM then compile and bundle all test targets
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: |
          env_script="$(cargo llvm-cov show-env --sh)"
          source /dev/stdin <<< "$env_script"
          python3 -B ops/ci/iam_compile_once.py produce-e2e --output "$RUNNER_TEMP/iam-ab-b"
          python3 -B ops/ci/iam_compile_once.py produce --output "$RUNNER_TEMP/iam-ab-b" \
            --matrix "$RUNNER_TEMP/iam-ab-b-matrix.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-ab-b-e2e-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-ab-b/e2e/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: ./.github/actions/upload-iam-tests
        with:
          prefix: iam-ab-b

  native-oauth:
    name: Common native OAuth
    if: github.repository == 'Djoe-Denne/IAMRusty'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: oauth
      - run: >-
          python3 -B ops/ci/iam_compile_once.py benchmark-native --part oauth
          --output "$RUNNER_TEMP/iam-ab-oauth"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-ab-common-oauth-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-ab-oauth/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  native-ext-authz:
    name: Common native Ext Authz
    if: github.repository == 'Djoe-Denne/IAMRusty'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: ext-authz
      - run: >-
          python3 -B ops/ci/iam_compile_once.py benchmark-native --part ext-authz
          --output "$RUNNER_TEMP/iam-ab-ext-authz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-ab-common-ext-authz-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-ab-ext-authz/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  coverage-a:
    name: A coverage
    needs: [build-a]
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: iam
      scope: full
      benchmark-arm: a
    secrets:
      IAMRUSTY_TEST_RSA8192_PEM_B64: ${{ secrets.IAMRUSTY_TEST_RSA8192_PEM_B64 }}

  coverage-b:
    name: B coverage
    needs: [build-b]
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: iam
      scope: full
      benchmark-arm: b
    secrets:
      IAMRUSTY_TEST_RSA8192_PEM_B64: ${{ secrets.IAMRUSTY_TEST_RSA8192_PEM_B64 }}

  e2e-a:
    name: A k6
    needs: [build-a, native-oauth, native-ext-authz]
    uses: ./.github/workflows/iam-ab-e2e.yml
    with:
      arm: a

  e2e-b:
    name: B k6
    needs: [build-b, native-oauth, native-ext-authz]
    uses: ./.github/workflows/iam-ab-e2e.yml
    with:
      arm: b
