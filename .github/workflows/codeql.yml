name: CodeQL Rust

on:
  pull_request:
    branches: [master]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '!.agents/**'
      - '!docs/**'
      - '!obsidian/**'
      - '.cargo/**'
      - '.gitmodules'
      - 'rust-toolchain.toml'
      - 'rustycog'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  push:
    branches: [master]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '!.agents/**'
      - '!docs/**'
      - '!obsidian/**'
      - '.cargo/**'
      - '.gitmodules'
      - 'rust-toolchain.toml'
      - 'rustycog'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '43 3 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (rust)
    # This workflow is qualified for the public repository, not a private Code Security plan.
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cargo resolves a path patch against the pinned public SDK checkout.
          submodules: true
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust
          build-mode: none
          tools: linked
          config-file: ./.github/codeql/config.yml
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:rust
          upload-database: false
