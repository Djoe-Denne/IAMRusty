name: CodeQL Rust

on:
  pull_request:
    branches: [master]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '!.agents/**'
      - '!docs/**'
      - '!obsidian/**'
      - '.cargo/**'
      - '.gitmodules'
      - 'rust-toolchain.toml'
      - 'rustycog'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  push:
    branches: [master]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '!.agents/**'
      - '!docs/**'
      - '!obsidian/**'
      - '.cargo/**'
      - '.gitmodules'
      - 'rust-toolchain.toml'
      - 'rustycog'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '43 3 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (rust)
    # This workflow is qualified for the public repository, not a private Code Security plan.
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cargo resolves a path patch against the pinned public SDK checkout.
          submodules: true
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust
          build-mode: none
          tools: linked
          config-file: ./.github/codeql/config.yml
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        id: codeql
        with:
          category: /language:rust
          upload: failure-only
          upload-database: false
      - name: Filter test filenames from Rust CodeQL results
        env:
          SARIF_DIR: ${{ steps.codeql.outputs.sarif-output }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          # Filter only the primary reported filename, not directories or flow steps.
          def is_test_result(result):
              locations = result.get("locations") or [{}]
              uri = locations[0].get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "")
              return "test" in unquote(urlsplit(uri).path).rsplit("/", 1)[-1]

          reports = sorted(Path(os.environ["SARIF_DIR"]).glob("*.sarif"))
          if not reports:
              raise SystemExit("No CodeQL SARIF reports found")
          for report in reports:
              sarif = json.loads(report.read_text(encoding="utf-8"))
              removed = 0
              for run in sarif["runs"]:
                  if "results" in run:
                      results = run["results"]
                      run["results"] = [result for result in results if not is_test_result(result)]
                      removed += len(results) - len(run["results"])
              report.write_text(json.dumps(sarif, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              print(f"{report.name}: removed {removed} results on test filenames")
          PY
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.codeql.outputs.sarif-output }}
          category: /language:rust
