name: IAM CI cold vs warm compiler cache
on:
  push:
    branches: [ci-iam-warm]

permissions:
  contents: read
  actions: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RUST_BACKTRACE: '1'
  RUN_ENV: test

jobs:
  prepare-cargo:
    name: Common locked Cargo downloads
    if: github.repository == 'Djoe-Denne/IAMRusty'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: python3 -B ops/ci/iam_ac_inputs.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-cd-common-cargo-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-ac-cargo-seed/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  prepare-apt:
    name: Common signed Ubuntu packages
    if: github.repository == 'Djoe-Denne/IAMRusty'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -B ops/ci/iam_apt_inputs.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-cd-common-apt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-warm-apt/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  prepare-runtime:
    name: Common prebuilt runtime base
    if: github.repository == 'Djoe-Denne/IAMRusty'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -B ops/tests/k6/ci/iam_ac_runtime.py "$RUNNER_TEMP/iam-ac-runtime"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-cd-common-runtime-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-ac-runtime/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  build-d-server:
    name: D instrumented IAM with prior compiler cache
    if: github.repository == 'Djoe-Denne/IAMRusty'
    needs: [prepare-cargo, prepare-apt]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-compiler-cache
      - uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install verified common Ubuntu packages offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ops/ci/iam_apt_inputs.py install
      - name: Restore the pinned prior compiler snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ops/ci/iam_warm_compiler.py
      - name: Build only the instrumented IAM server and migration
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: |
          env_script="$(cargo llvm-cov show-env --sh)"
          source /dev/stdin <<< "$env_script"
          python3 -B ops/ci/iam_compile_once.py produce-e2e --output "$RUNNER_TEMP/iam-cd-d-server"
      - uses: ./.github/actions/compiler-cache-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-cd-d-e2e-d-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-cd-d-server/e2e/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  build-c-server:
    name: C independent instrumented IAM
    if: github.repository == 'Djoe-Denne/IAMRusty'
    needs: [prepare-cargo, prepare-apt]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-compiler-cache
      - uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install verified common Ubuntu packages offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ops/ci/iam_apt_inputs.py install
      - name: Build only the instrumented IAM server and migration
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: |
          env_script="$(cargo llvm-cov show-env --sh)"
          source /dev/stdin <<< "$env_script"
          python3 -B ops/ci/iam_compile_once.py produce-e2e --output "$RUNNER_TEMP/iam-cd-c-server"
      - uses: ./.github/actions/compiler-cache-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-cd-c-e2e-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-cd-c-server/e2e/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  build-c-tests:
    name: C independent instrumented test bundles
    if: github.repository == 'Djoe-Denne/IAMRusty'
    needs: [prepare-cargo, prepare-apt]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-compiler-cache
      - uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install verified common Ubuntu packages offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ops/ci/iam_apt_inputs.py install
      - name: Compile and bundle the five partitions independently of the k6 server
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: |
          env_script="$(cargo llvm-cov show-env --sh)"
          source /dev/stdin <<< "$env_script"
          python3 -B ops/ci/iam_compile_once.py produce --output "$RUNNER_TEMP/iam-cd-c" \
            --matrix "$RUNNER_TEMP/iam-cd-c-matrix.json"
      - uses: ./.github/actions/compiler-cache-stats
      - uses: ./.github/actions/upload-iam-tests
        with:
          prefix: iam-cd-c

  build-d-tests:
    name: D instrumented test bundles with prior compiler cache
    if: github.repository == 'Djoe-Denne/IAMRusty'
    needs: [prepare-cargo, prepare-apt]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-compiler-cache
      - uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install verified common Ubuntu packages offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ops/ci/iam_apt_inputs.py install
      - name: Restore the pinned prior compiler snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ops/ci/iam_warm_compiler.py
      - name: Compile and bundle the five partitions independently of the k6 server
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: |
          env_script="$(cargo llvm-cov show-env --sh)"
          source /dev/stdin <<< "$env_script"
          python3 -B ops/ci/iam_compile_once.py produce --output "$RUNNER_TEMP/iam-cd-d" \
            --matrix "$RUNNER_TEMP/iam-cd-d-matrix.json"
      - uses: ./.github/actions/compiler-cache-stats
      - uses: ./.github/actions/upload-iam-tests
        with:
          prefix: iam-cd-d

  native-oauth:
    name: Common native OAuth
    if: github.repository == 'Djoe-Denne/IAMRusty'
    needs: [prepare-cargo]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: oauth
      - run: >-
          python3 -B ops/ci/iam_compile_once.py benchmark-native --part oauth
          --output "$RUNNER_TEMP/iam-ac-oauth"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-cd-common-oauth-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-ac-oauth/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  native-ext-authz:
    name: Common native Ext Authz
    if: github.repository == 'Djoe-Denne/IAMRusty'
    needs: [prepare-cargo]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: ext-authz
      - run: >-
          python3 -B ops/ci/iam_compile_once.py benchmark-native --part ext-authz
          --output "$RUNNER_TEMP/iam-ac-ext-authz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-cd-common-ext-authz-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-ac-ext-authz/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  coverage-d:
    name: D coverage
    needs: [build-d-tests]
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: iam
      scope: full
      benchmark-arm: d
    secrets:
      IAMRUSTY_TEST_RSA8192_PEM_B64: ${{ secrets.IAMRUSTY_TEST_RSA8192_PEM_B64 }}

  coverage-c:
    name: C coverage
    needs: [build-c-tests]
    uses: ./.github/workflows/ci-coverage.yml
    with:
      service: iam
      scope: full
      benchmark-arm: c
    secrets:
      IAMRUSTY_TEST_RSA8192_PEM_B64: ${{ secrets.IAMRUSTY_TEST_RSA8192_PEM_B64 }}

  e2e-d:
    name: D k6
    needs: [build-d-server, native-oauth, native-ext-authz, prepare-runtime]
    uses: ./.github/workflows/iam-ac-e2e.yml
    with:
      arm: d

  e2e-c:
    name: C k6
    needs: [build-c-server, native-oauth, native-ext-authz, prepare-runtime]
    uses: ./.github/workflows/iam-ac-e2e.yml
    with:
      arm: c
