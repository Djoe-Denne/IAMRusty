name: IAM instrumented E2E qualification
on:
  push:
    branches: [ci-iam-compile-once]

permissions:
  contents: read
  actions: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUST_BACKTRACE: "1"
  RUN_ENV: test

jobs:
  producer:
    name: Pilot IAM instrumented compile
    if: github.repository == 'Djoe-Denne/IAMRusty'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-compiler-cache
      - uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install the same IAM system dependency
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu*' -delete
          sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Build and bundle the instrumented IAM server and migration
        shell: bash
        run: |
          env_script="$(cargo llvm-cov show-env --sh)"
          source /dev/stdin <<< "$env_script"
          python3 -B ops/ci/iam_compile_once.py produce-e2e --output "$RUNNER_TEMP/iam-pilot"
      - name: Upload the IAM E2E bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-pilot-e2e-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-pilot/e2e/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  native-oauth:
    name: Pilot OAuth native build
    if: github.repository == 'Djoe-Denne/IAMRusty'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: oauth
      - run: python3 -B ops/ci/iam_compile_once.py companion --part oauth --output "$RUNNER_TEMP/iam-pilot-oauth"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-pilot-oauth-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-pilot-oauth/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  native-ext-authz:
    name: Pilot Ext Authz native build
    if: github.repository == 'Djoe-Denne/IAMRusty'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/build-service
        with:
          service: ext-authz
      - run: python3 -B ops/ci/iam_compile_once.py companion --part ext-authz --output "$RUNNER_TEMP/iam-pilot-ext-authz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iam-pilot-ext-authz-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-pilot-ext-authz/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  pilot-e2e:
    if: github.repository == 'Djoe-Denne/IAMRusty'
    name: Pilot existing k6 scenarios (experimental IAM binary)
    needs: [producer, native-oauth, native-ext-authz]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Acquire exact pilot binaries by API digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          for role in e2e oauth ext-authz; do
            python3 -B ops/ci/iam_compile_once.py fetch --part "$role" \
              --output "$RUNNER_TEMP/iam-pilot-acquired/$role"
          done
      - name: Package and admit only the experimental three-role images
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/iam-pilot-images/verified"
          python3 -B ops/tests/k6/ci/iam_pilot.py pack "$RUNNER_TEMP/iam-pilot-acquired" \
            "$RUNNER_TEMP/iam-pilot-images/verified/packaged"
          python3 -B ops/tests/k6/ci/iam_pilot.py close-probes "$RUNNER_TEMP/iam-pilot-images/verified/packaged"
          for file in images.tar.gz provenance.json cleanup.json; do
            mv "$RUNNER_TEMP/iam-pilot-images/verified/packaged/$file" "$RUNNER_TEMP/iam-pilot-images/verified/$file"
          done
      - name: Install existing browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
          python3 -m pip install 'PyYAML==6.0.2'
      - name: Acquire and verify the pinned CI CLI tools
        run: python3 -B ops/tests/k6/ci/provision.py --output "$RUNNER_TEMP/iam-pilot-cli"
      - name: Acquire and verify k6 and Chromium
        run: python3 -B ops/tests/k6/provision-linux.py --output "$RUNNER_TEMP/iam-pilot-browser"
      - name: Execute unchanged scenarios and restore fixtures
        run: >-
          python3 -B ops/tests/k6/ci/iam_pilot.py run --directory "$RUNNER_TEMP/iam-pilot-campaign"
          --cli-directory "$RUNNER_TEMP/iam-pilot-cli" --browser-directory "$RUNNER_TEMP/iam-pilot-browser"
          --image-directory "$RUNNER_TEMP/iam-pilot-images"
      - name: Verify owned packaging and campaign cleanup
        if: always()
        run: |
          status=0
          python3 -B ops/tests/k6/ci/iam_pilot.py close-probes "$RUNNER_TEMP/iam-pilot-images/verified/packaged" || status=1
          python3 -B ops/tests/k6/ci/iam_pilot.py clean --directory "$RUNNER_TEMP/iam-pilot-campaign" || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: iam-pilot-e2e-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/iam-pilot-campaign/public/report.json
            ${{ runner.temp }}/iam-pilot-campaign/public/provenance.json
            ${{ runner.temp }}/iam-pilot-campaign/public/cleanup.json
          if-no-files-found: warn
          retention-days: 3
