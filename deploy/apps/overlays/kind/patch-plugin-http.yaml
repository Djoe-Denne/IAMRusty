apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-stub
  namespace: aiforall-plugins
spec:
  template:
    spec:
      containers:
        - name: plugin
          image: busybox:1.37
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
