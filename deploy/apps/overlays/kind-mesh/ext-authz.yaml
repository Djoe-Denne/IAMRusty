# Opt-in mesh AuthN (ADR-0308). Manual apply only — not in overlays/kind.
apiVersion: v1
kind: Service
metadata:
  name: ext-authz
  namespace: aiforall-gateway
  labels:
    app.kubernetes.io/name: ext-authz
    app.kubernetes.io/part-of: aiforall
    app.kubernetes.io/component: mesh-authn
spec:
  selector:
    app.kubernetes.io/name: ext-authz
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-authz
  namespace: aiforall-gateway
  labels:
    app.kubernetes.io/name: ext-authz
    app.kubernetes.io/part-of: aiforall
    app.kubernetes.io/component: mesh-authn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ext-authz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ext-authz
        app.kubernetes.io/part-of: aiforall
        app.kubernetes.io/component: mesh-authn
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ext-authz
          image: aiforall-ext-authz:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: PORT
              value: "8090"
            - name: EXT_AUTHZ_AUDIENCE
              value: aiforall
            - name: EXT_AUTHZ_JWKS_POLL_SECS
              value: "2"
            # Real IAM from platform-services.yaml (not the pause image in overlays/kind).
            - name: EXT_AUTHZ_JWKS_URL
              value: https://iam.aiforall-platform.svc.cluster.local:8443/iam/.well-known/jwks.json
            - name: EXT_AUTHZ_TLS_CERT
              value: /app/certs/ext-authz.crt
            - name: EXT_AUTHZ_TLS_KEY
              value: /app/certs/ext-authz.key
            - name: EXT_AUTHZ_TLS_CA
              value: /app/certs/ca.crt
          volumeMounts:
            - name: certs
              mountPath: /app/certs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: certs
          secret:
            secretName: platform-mesh-certs
