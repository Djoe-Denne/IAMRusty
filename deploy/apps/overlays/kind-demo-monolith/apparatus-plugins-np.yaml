# Default-deny + DNS + plugin↔oodhive sur apparatus-plugins (ns gold path).
# Même sémantique que aiforall-plugins (base + patches 8080/8443), sans fusionner
# apparatus-operator/k8s/04-networkpolicy.yaml (labels IT apparatus-gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: apparatus-plugins
  labels:
    app.kubernetes.io/part-of: aiforall
    aiforall.io/overlay: kind-demo-monolith
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aiforall-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: oodhive-monolith
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aiforall-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: oodhive-monolith
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
