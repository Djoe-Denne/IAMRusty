# 4 slices plateforme (iam, hive, manifesto, telegraph). Image pause M1 — pas de binaire Rust.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  namespace: aiforall-platform
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/part-of: aiforall
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iam
        app.kubernetes.io/part-of: aiforall
        app.kubernetes.io/component: platform
    spec:
      automountServiceAccountToken: false
      containers:
        - name: iam
          image: registry.k8s.io/pause:3.10
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: iam
  namespace: aiforall-platform
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/part-of: aiforall
spec:
  selector:
    app.kubernetes.io/name: iam
  ports:
    - name: http
      port: 8080
      targetPort: http
---
