# Opt-in mesh profile (ADR-0308). NOT the default stack.
# Launch: docker compose -f docker-compose.yml -f deploy/mesh/compose.yaml --profile mesh up
# Replayable e2e: bash scripts/mesh-authn-e2e.sh
# Kind: kubectl apply -k deploy/apps/overlays/kind-mesh
# HTTP ext_authz. No Envoy JWT filter. No sidecar.
# Lua strips every request header whose name starts with x-principal- BEFORE ext_authz.
# header_mutation cannot match a prefix; Lua is used only for this strip.
# allowed_upstream_headers forwards only iss/sub recreated by Check.
# Do NOT request_headers_to_remove iss/sub on the route.
# Do NOT set http_service.path_prefix (`/` + `/foo` = `//foo`).
# failure_mode_allow: false. Client certs are required on every hop.

static_resources:
  listeners:
    - name: listener_mesh
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/envoy-mesh.crt
                    private_key:
                      filename: /etc/envoy/certs/envoy-mesh.key
                validation_context:
                  trusted_ca:
                    filename: /etc/envoy/certs/ca.crt
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mesh_ingress
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            path: /iam/.well-known/jwks.json
                          route:
                            cluster: iam
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match:
                            path: /iam/api/auth/signup
                          route:
                            cluster: iam
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match:
                            path: /iam/api/auth/login
                          route:
                            cluster: iam
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match:
                            prefix: "/iam/"
                          route:
                            cluster: iam
                        - match:
                            prefix: "/hive/"
                          route:
                            cluster: hive
                        - match:
                            prefix: "/telegraph/"
                          route:
                            cluster: telegraph
                        - match:
                            prefix: "/manifesto/"
                          route:
                            cluster: manifesto
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(request_handle)
                            local headers = request_handle:headers()
                            local doomed = {}
                            for key, _ in pairs(headers) do
                              if string.sub(string.lower(key), 1, 12) == "x-principal-" then
                                table.insert(doomed, key)
                              end
                            end
                            for _, key in ipairs(doomed) do
                              headers:remove(key)
                            end
                          end
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      http_service:
                        server_uri:
                          uri: https://ext-authz:8090/
                          cluster: ext_authz
                          timeout: 5s
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: authorization
                              - prefix: x-principal-
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-principal-iss
                              - exact: x-principal-sub
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: ext_authz
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: ext-authz
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: /etc/envoy/certs/envoy-mesh.crt
                private_key:
                  filename: /etc/envoy/certs/envoy-mesh.key
            validation_context:
              trusted_ca:
                filename: /etc/envoy/certs/ca.crt
      load_assignment:
        cluster_name: ext_authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ext-authz
                      port_value: 8090

    - name: iam
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: iam-service
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: /etc/envoy/certs/envoy-mesh.crt
                private_key:
                  filename: /etc/envoy/certs/envoy-mesh.key
            validation_context:
              trusted_ca:
                filename: /etc/envoy/certs/ca.crt
      load_assignment:
        cluster_name: iam
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: iam-service
                      port_value: 8443

    - name: hive
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: hive-service
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: /etc/envoy/certs/envoy-mesh.crt
                private_key:
                  filename: /etc/envoy/certs/envoy-mesh.key
            validation_context:
              trusted_ca:
                filename: /etc/envoy/certs/ca.crt
      load_assignment:
        cluster_name: hive
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: hive-service
                      port_value: 8443

    - name: telegraph
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: telegraph-service
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: /etc/envoy/certs/envoy-mesh.crt
                private_key:
                  filename: /etc/envoy/certs/envoy-mesh.key
            validation_context:
              trusted_ca:
                filename: /etc/envoy/certs/ca.crt
      load_assignment:
        cluster_name: telegraph
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: telegraph-service
                      port_value: 8443

    - name: manifesto
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: manifesto-service
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: /etc/envoy/certs/envoy-mesh.crt
                private_key:
                  filename: /etc/envoy/certs/envoy-mesh.key
            validation_context:
              trusted_ca:
