[package]
name = "manifesto-infra"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Manifesto infrastructure layer"
license.workspace = true

[features]
test-utils = []

[dependencies]
# Internal dependencies
manifesto-domain = { path = "../domain" }
manifesto-application = { path = "../application" }

# Event crates
apparatus-events = { path = "../../apparatus-events" }

# Shared crates
readiness = { path = "../../readiness" }
rustycog = { package = "rustycog-framework", version = "0.1.1", features = ["full"] }

# Database
sea-orm = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Utilities
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Async
async-trait = { workspace = true }
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

