# IAM Service Default Configuration

[server]
host = "127.0.0.1"
port = 8080
tls_enabled = false
tls_cert_path = "./certs/cert.pem"
tls_key_path = "./certs/key.pem"
tls_port = 8443

[auth.jwt]
hs256_secret = "rustycog-dev-hs256-secret"
issuer = "iamrusty"
audience = "aiforall"

[database]
# Database connection details
host = "localhost"
port = 5432
db = "iam_dev"
# Database credentials
[database.creds]
username = "postgres"
password = "postgres"

# Specify read replicas if using a read/write split
read_replicas = []

[[idp.connectors]]
id = "github"
base_url = "http://127.0.0.1:8085/github-connect"
hmac_secret = "change-me-github-connect-hmac"
redirect_uris = [
  "http://127.0.0.1:8080/iam/api/auth/github/callback",
  "http://127.0.0.1:8080/iam/api/auth/github/relink-callback",
]

[[idp.connectors]]
id = "gitlab"
base_url = "http://127.0.0.1:8086/gitlab-connect"
hmac_secret = "change-me-gitlab-connect-hmac"
redirect_uris = [
  "http://127.0.0.1:8080/iam/api/auth/gitlab/callback",
  "http://127.0.0.1:8080/iam/api/auth/gitlab/relink-callback",
]

[jwt]
expiration_seconds = 900  # 15 minutes
refresh_token_expiration_seconds = 2592000  # 30 days
issuer = "iamrusty"
audience = "aiforall"
oauth_state_secret = "iam-oauth-state-hmac-change-me"

# JWT secret configuration using HS256 shared secret
[jwt.secret]
type = "plain"
value = "rustycog-dev-hs256-secret"

[command]
[command.retry]
max_attempts = 3
base_delay_ms = 100
max_delay_ms = 30000
backoff_multiplier = 2.0
use_jitter = true

# Queue configuration for testing - using SQS
[queue]
type = "sqs"
enabled = true  # Enabled for real SQS integration tests
region = "us-east-1"
account_id = "000000000000"
default_queues = ["telegraph-events"]
# Use new host/port configuration instead of endpoint_url
host = "localhost"
port = 0  # Use random port for testing (will set EXTERNAL_SERVICE_PORTS_START)
access_key_id = "test"
secret_access_key = "test"
max_retries = 3
timeout_seconds = 30

[queue.queues]
user_signed_up = ["telegraph-events"]
user_email_verified = ["telegraph-events"]
password_reset_requested = ["telegraph-events"]
