# IAM Service - Development Configuration
#
# This profile mirrors the test configuration but targets the docker-compose
# stack on the shared `aiforall-network`. Hostnames such as `postgres`,
# `localstack`, and `openfga` resolve to the matching compose services.

[server]
host = "0.0.0.0"
port = 8080
tls_enabled = true
tls_port = 8443
tls_cert_path = "/app/certs/iam-service.crt"
tls_key_path = "/app/certs/iam-service.key"
tls_client_ca_path = "/app/certs/ca.crt"

[auth.jwt]
hs256_secret = "rustycog-dev-hs256-secret"
issuer = "iamrusty"
audience = "aiforall"

[database]
host = "postgres"
port = 5432
db = "iam_dev"
[database.creds]
username = "postgres"
password = "postgres"

# IAM → Connect S2S is HTTP on the compose network (service DNS :8080), not HTTPS mesh.
# HMAC (0409) authenticates the hop. Public OAuth callbacks stay on IAM :8080.
[[idp.connectors]]
id = "github"
base_url = "http://github-connect-service:8080/github-connect"
hmac_secret = "change-me-github-connect-hmac"
redirect_uris = [
  "http://127.0.0.1:8080/iam/api/auth/github/callback",
  "http://127.0.0.1:8080/iam/api/auth/github/relink-callback",
]

[[idp.connectors]]
id = "gitlab"
base_url = "http://gitlab-connect-service:8080/gitlab-connect"
hmac_secret = "change-me-gitlab-connect-hmac"
redirect_uris = [
  "http://127.0.0.1:8080/iam/api/auth/gitlab/callback",
  "http://127.0.0.1:8080/iam/api/auth/gitlab/relink-callback",
]

[jwt]
expiration_seconds = 900
refresh_token_expiration_seconds = 2592000
issuer = "iamrusty"
audience = "aiforall"
oauth_state_secret = "iam-oauth-state-hmac-change-me"

[jwt.secret]
type = "plain"
value = "rustycog-dev-hs256-secret"

[logging]
level = "debug"

[command.retry]
max_attempts = 0
base_delay_ms = 50
max_delay_ms = 5000
backoff_multiplier = 2.0
use_jitter = false

[queue]
type = "sqs"
enabled = true
region = "us-east-1"
account_id = "000000000000"
default_queues = ["telegraph-events"]
host = "localstack"
port = 4566
access_key_id = "test"
secret_access_key = "test"
max_retries = 3
timeout_seconds = 30

[queue.queues]
user_signed_up = ["telegraph-events"]
user_email_verified = ["telegraph-events"]
password_reset_requested = ["telegraph-events"]
