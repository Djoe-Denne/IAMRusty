# IAM Service Test Configuration
# This configuration is used by integration tests

# Root-level AppConfig field (must sit above [server] or TOML nests it).
internal_service_token = "iam-internal-test-token"

[server]
host = "127.0.0.1"
port = 8081
tls_enabled = false

[auth.jwt]
audience = "aiforall"
jwks_url = "http://127.0.0.1:8081/iam/.well-known/jwks.json"
allowed_algorithms = ["RS256"]

[database]
# Database connection details
host = "localhost"
port = 0  # Use random port for testing
db = "test-db"
# Database credentials
[database.creds]
username = "postgres"
password = "postgres"

[[idp.connectors]]
id = "github"
base_url = "http://127.0.0.1:3000/github-connect"
hmac_secret = "iam-idp-connect-test-hmac"
redirect_uris = [
  "http://127.0.0.1:8081/iam/api/auth/github/callback",
  "http://127.0.0.1:8081/iam/api/auth/github/relink-callback",
]

[[idp.connectors]]
id = "gitlab"
base_url = "http://127.0.0.1:3000/gitlab-connect"
hmac_secret = "iam-idp-connect-test-hmac"
redirect_uris = [
  "http://127.0.0.1:8081/iam/api/auth/gitlab/callback",
  "http://127.0.0.1:8081/iam/api/auth/gitlab/relink-callback",
]

[jwt]
expiration_seconds = 900  # 15 minutes
refresh_token_expiration_seconds = 2592000  # 30 days
issuer = "http://127.0.0.1:8081/iam"
audience = "aiforall"
public_base_url = "http://127.0.0.1:8081"
jwks_url = "http://127.0.0.1:8081/iam/.well-known/jwks.json"
allowed_algorithms = ["RS256"]
oauth_state_secret = "iam-oauth-state-hmac-test"

# JWT secret configuration using RS256 PEM (test-platform keys)
[jwt.secret]
type = "pem_file"
private_key_path = "config/keys/test-platform.pem"
public_key_path = "config/keys/test-platform.pub"
key_id = "test-rs256-kid-01"

# Enable maximum logging for tests
[logging]
level = "debug"
filter = "debug"

# Command configuration for testing
[command.retry]
# Faster retry settings for tests
max_attempts = 0
base_delay_ms = 50
max_delay_ms = 5000
backoff_multiplier = 2.0
use_jitter = false  # Disable jitter for predictable test behavior

# Queue configuration for testing - using SQS
[queue]
enabled = false
type = "sqs"
region = "us-east-1"
account_id = "000000000000"
default_queues = ["test-iam-default-events"]
# Use new host/port configuration instead of endpoint_url
host = "localhost"
port = 0  # Use random port for testing (will set EXTERNAL_SERVICE_PORTS_START)
access_key_id = "test"
secret_access_key = "test"
max_retries = 3
timeout_seconds = 30

# Queue mappings for different event types (can be extended)
[queue.queues]
user_signed_up = ["test-telegraph-events"]
user_email_verified = ["test-telegraph-events"]
password_reset_requested = ["test-telegraph-events"]
