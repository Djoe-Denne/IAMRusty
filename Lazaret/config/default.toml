# Lazaret Service Default Configuration (TOML)

[server]
host = "127.0.0.1"
port = 8080
tls_enabled = false
tls_cert_path = "./certs/cert.pem"
tls_key_path = "./certs/key.pem"
tls_port = 8443

[auth.jwt]
hs256_secret = "rustycog-dev-hs256-secret"
issuer = "iamrusty"
audience = "aiforall"

# Workload identity — dedicated session key, not [auth.jwt].
[identity]
session_ttl_minutes = 15
cert_ttl_hours = 24

[database]
host = "localhost"
port = 5432
db = "lazaret_dev"
[database.creds]
username = "postgres"
password = "postgres"
read_replicas = []

[logging]
level = "info"

[command]
[command.retry]
max_attempts = 3
base_delay_ms = 100
max_delay_ms = 30000
backoff_multiplier = 2.0
use_jitter = true

[manifesto_service]
base_url = "http://127.0.0.1:8080/manifesto"
timeout_seconds = 10
bearer_token = ""
hs256_secret = "manifesto-grant-snapshot-dev-hs256"
issuer = "aiforall-platform"
audience = "manifesto-bindings"

[kv]
backend = "postgres"

[redis]
hostname = "127.0.0.1"
port = 6379

[vault]
base_url = ""
token = ""
mount = "secret"

[queue]
type = "sqs"
enabled = false
region = "us-east-1"
account_id = "000000000000"
default_queues = []
host = "localhost"
port = 0
access_key_id = "test"
secret_access_key = "test"
max_retries = 3
timeout_seconds = 30
