[package]
name = "lazaret-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Lazaret capability-boundary service for the AIForAll platform"
license.workspace = true

[features]
test-mode = []
qa-mode = []

[dependencies]
lazaret-domain = { path = "domain" }
lazaret-application = { path = "application" }
lazaret-infra = { path = "infra" }
lazaret-http = { path = "http" }
lazaret-configuration = { path = "configuration" }
lazaret-setup = { path = "setup" }
lazaret-migration = { path = "migration" }

rustycog = { package = "rustycog-framework", version = "0.1.1", features = ["full", "test-utils"] }

axum = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }

sea-orm = { workspace = true }
sea-orm-migration = { workspace = true, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
config = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

tower = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
axum-test = { workspace = true }
tokio-test = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
tracing-subscriber = { workspace = true }
serial_test = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
wiremock = { workspace = true }
sea-orm = { workspace = true }
jsonwebtoken = { workspace = true }
