[package]
name = "oauth-connect-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "OAuthConnect standalone v2 service"

[lints]
workspace = true

[[bin]]
name = "oauth-connect-service"
path = "src/main.rs"

[dependencies]
oauth-connect-configuration = { path = "configuration" }
oauth-connect-setup = { path = "setup" }
rustycog = { package = "rustycog-framework", version = "0.1.1", default-features = false, features = ["core", "logger"] }
tokio = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
rsa = { workspace = true }
chrono = { workspace = true }
idp-connect-contract = { path = "../../crates/idp-connect-contract" }
