[package]
name = "oauth-connect-http"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Immutable instance routing for OAuthConnect v2"

[lints]
workspace = true

[dependencies]
rustycog = { package = "rustycog-framework", version = "0.1.1", default-features = false, features = ["http"] }
idp-connect-contract = { path = "../../../crates/idp-connect-contract", features = ["server"] }
readiness = { path = "../../../crates/readiness" }
axum = { workspace = true }

[dev-dependencies]
oauth-connect-configuration = { path = "../configuration" }
oauth-connect-infra = { path = "../infra" }
tokio = { workspace = true, features = ["time", "sync"] }
wiremock = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["gzip"] }
tower = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
