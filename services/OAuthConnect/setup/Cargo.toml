[package]
name = "oauth-connect-setup"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Minimal OAuthConnect startup secrets and OAuth client composition"

[lints]
workspace = true

[dependencies]
rustycog = { package = "rustycog-framework", version = "0.1.1", default-features = false, features = ["core", "secrets", "http"] }
oauth-connect-configuration = { path = "../configuration" }
oauth-connect-infra = { path = "../infra" }
oauth-connect-http = { path = "../http" }
idp-connect-contract = { path = "../../../crates/idp-connect-contract" }
reqwest = { workspace = true, features = ["gzip"] }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
readiness = { path = "../../../crates/readiness" }
axum = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "time", "sync"] }
wiremock = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
toml = { workspace = true }
jsonwebtoken = { workspace = true }
rsa = { workspace = true }
chrono = { workspace = true }
flate2 = "=1.1.10"
