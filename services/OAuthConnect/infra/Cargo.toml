[package]
name = "oauth-connect-infra"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "OAuth transport and pure JSONPath profile projection for OAuthConnect"

[lints]
workspace = true

[dependencies]
rustycog = { package = "rustycog-framework", version = "0.1.1", default-features = false, features = ["core", "secrets"] }
oauth-connect-configuration = { path = "../configuration" }
oauth-connect-domain = { path = "../domain" }
idp-connect-contract = { path = "../../../crates/idp-connect-contract" }
serde_json = { workspace = true }
jsonpath-rust = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["gzip"] }
url = { workspace = true }
base64 = { workspace = true }
openidconnect = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
serde = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }
wiremock = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
rustycog = { package = "rustycog-framework", version = "0.1.1", default-features = false, features = ["testing"] }
# Already locked through reqwest gzip; fixtures need exact decompressed edges.
flate2 = "=1.1.10"
jsonwebtoken = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
