# GitHub Connect - Development Configuration
#
# Targets the docker-compose stack. Host ports: 8085 HTTP / 8446 HTTPS.

[server]
host = "0.0.0.0"
port = 8080
tls_enabled = true
tls_port = 8443
tls_cert_path = "/app/certs/github-connect-service.crt"
tls_key_path = "/app/certs/github-connect-service.key"
tls_client_ca_path = "/app/certs/ca.crt"

[auth.jwt]
platform_issuer = "http://127.0.0.1:8080/iam"
allow_historical_platform_issuer = false
audience = "aiforall"
jwks_url = "http://127.0.0.1:8080/iam/.well-known/jwks.json"
allowed_algorithms = ["RS256"]


[logging]
level = "debug"

[github]
secrets_mode = "openbao"
pkce_supported = false
client_id = "your-github-client-id"
auth_url = "https://github.com/login/oauth/authorize"
token_url = "https://github.com/login/oauth/access_token"
user_url = "https://api.github.com/user"
redirect_uris = [
  "http://127.0.0.1:8080/iam/api/auth/github/callback",
  "http://127.0.0.1:8080/iam/api/auth/github/relink-callback",
]

[github.client_secret_ref]
mount = "secret"
path = "github-connect/oauth"
field = "client_secret"

[github.hmac_secret_ref]
mount = "secret"
path = "github-connect/iam"
field = "hmac_secret"

# Override origin/identity for the environment. No credentials in this file.
[openbao]
endpoint = "https://bao.example.invalid:8200"
allow_loopback_http = false

[openbao.auth]
method = "token_file"
path = "./secrets/github-connect.bao-token"
