profile: gitlab-proof
resources:
  secret-aiforall-local-full-oauth-proof-inputs:
    category: foundation
    object:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oauth-proof-inputs-{{ .Values.runId }}
        namespace: aiforall-local-full
        annotations:
          aiforall.dev/private-envelope: proof-provider
          aiforall.dev/attempt-bound: 'true'
      type: Opaque
  configmap-aiforall-local-full-envoy-mesh-config:
    files:
      envoy.yaml: files/config/envoy.yaml
  configmap-aiforall-local-full-oauth-proof-simulator-mmk62f9gt2:
    category: foundation
    object:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: oauth-proof-simulator-mmk62f9gt2
        namespace: aiforall-local-full
    files:
      oauth-idp-simulator.py: files/public/6f72a70bd830/oauth-idp-simulator.py
  secret-aiforall-local-full-oauth-proof-gitlab-config-9ck6hf6btg:
    category: foundation
    object:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oauth-proof-gitlab-config-9ck6hf6btg-{{ .Values.runId }}
        namespace: aiforall-local-full
        annotations:
          aiforall.dev/private-envelope: secret-aiforall-local-full-oauth-proof-gitlab-config-9ck6hf6btg
          aiforall.dev/attempt-bound: 'true'
      type: Opaque
    privateFiles:
      development.toml: files/private/secret-aiforall-local-full-oauth-proof-gitlab-config-9ck6hf6btg/development.toml
  secret-aiforall-local-full-oauth-proof-iam-config-tfb4gmhctg:
    category: foundation
    object:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oauth-proof-iam-config-tfb4gmhctg-{{ .Values.runId }}
        namespace: aiforall-local-full
        annotations:
          aiforall.dev/private-envelope: secret-aiforall-local-full-oauth-proof-iam-config-tfb4gmhctg
          aiforall.dev/template-configmap: iam-dev-config-7ctdd25hb2
          aiforall.dev/attempt-bound: 'true'
      type: Opaque
  service-aiforall-local-full-gitlab-connect:
    category: foundation
    object:
      apiVersion: v1
      kind: Service
      metadata:
        name: gitlab-connect
        namespace: aiforall-local-full
      spec:
        ports:
        - name: https
          port: 8443
          targetPort: https
        selector:
          app.kubernetes.io/name: gitlab-connect
    refreshTarget: gitlab
  service-aiforall-local-full-oauth-idp-simulator:
    category: foundation
    object:
      apiVersion: v1
      kind: Service
      metadata:
        name: oauth-idp-simulator
        namespace: aiforall-local-full
      spec:
        ports:
        - name: http
          port: 8080
          targetPort: 8080
        selector:
          app.kubernetes.io/name: oauth-idp-simulator
  deployment-aiforall-local-full-gitlab-connect:
    category: applications
    object:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gitlab-connect
        namespace: aiforall-local-full
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: gitlab-connect
        template:
          metadata:
            labels:
              app.kubernetes.io/name: gitlab-connect
          spec:
            automountServiceAccountToken: false
            containers:
            - env:
              - name: RUST_ENVIRONMENT
                value: development
              image: aiforall-gitlab-connect-service:latest
              imagePullPolicy: Never
              name: gitlab-connect
              ports:
              - containerPort: 8443
                name: https
              readinessProbe:
                periodSeconds: 5
                tcpSocket:
                  port: https
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
              volumeMounts:
              - mountPath: /app/config/development.toml
                name: config
                readOnly: true
                subPath: development.toml
              - mountPath: /app/certs
                name: certs
                readOnly: true
            securityContext:
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            volumes:
            - name: config
              secret:
                secretName: oauth-proof-gitlab-config-9ck6hf6btg-{{ .Values.runId }}
            - name: certs
              secret:
                secretName: oauth-proof-connector-tls-{{ .Values.runId }}
    refreshTarget: gitlab
  deployment-aiforall-local-full-iam:
    object:
      spec:
        template:
          spec:
            containers:
            - env:
              - name: SSL_CERT_FILE
                value: /oauth-proof-trust/ca-bundle.pem
              - name: IAM_QUEUE__ENABLED
                value: 'true'
              - name: IAM_QUEUE__HOST
                value: localstack
              - name: RUST_LOG
                value: info
              - name: RUST_ENVIRONMENT
                value: development
              - name: DATABASE_URL
                value: postgres://postgres:postgres@postgres:5432/iam_dev
              - name: IAM_INTERNAL_SERVICE_TOKEN
                value: iam-internal-dev-token
              - name: IAM_SERVER__TLS_REQUIRE_CLIENT_CERT
                value: 'true'
              - name: IAM_AUTH__MESH__TRUSTED_GATEWAY_SAN
                value: envoy-mesh
              image: aiforall-iam-service:latest
              imagePullPolicy: Never
              name: iam
              ports:
              - containerPort: 8080
                name: http
              - containerPort: 8443
                name: https
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /iam/ready
                  port: http
                periodSeconds: 5
                timeoutSeconds: 2
              resources:
                limits:
                  cpu: '1'
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                  type: RuntimeDefault
              startupProbe:
                failureThreshold: 36
                httpGet:
                  path: /iam/health
                  port: http
                periodSeconds: 5
              volumeMounts:
              - mountPath: /app/config/development.toml
                name: oauth-proof-config
                readOnly: true
                subPath: development.toml
              - mountPath: /oauth-proof-trust
                name: oauth-proof-trust
                readOnly: true
              - mountPath: /app/config/keys/test-platform.pem
                name: signing-key
                subPath: test-platform.pem
                readOnly: true
              - mountPath: /app/config/keys/test-platform.pub
                name: config
                subPath: test-platform.pub
                readOnly: true
              - mountPath: /app/certs
                name: certs
                readOnly: true
            initContainers:
            - command:
              - sh
              - -ec
              - cat /etc/ssl/certs/ca-certificates.crt /public-ca/ca.crt > /trust/ca-bundle.pem
              image: aiforall-iam-service:latest
              imagePullPolicy: Never
              name: oauth-proof-trust
              resources:
                limits:
                  cpu: 100m
                  memory: 32Mi
                requests:
                  cpu: 10m
                  memory: 16Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
              volumeMounts:
              - mountPath: /public-ca
                name: oauth-proof-public-ca
                readOnly: true
              - mountPath: /trust
                name: oauth-proof-trust
            securityContext:
              fsGroup: 1000
            volumes:
            - name: oauth-proof-config
              secret:
                secretName: oauth-proof-iam-config-tfb4gmhctg-{{ .Values.runId }}
            - name: oauth-proof-public-ca
              secret:
                secretName: oauth-proof-public-ca-{{ .Values.runId }}
            - emptyDir: {}
              name: oauth-proof-trust
            - name: config
              configMap:
                name: iam-dev-config-7ctdd25hb2
            - name: certs
              secret:
                items:
                - key: ca.crt
                  path: ca.crt
                - key: iam-service.crt
                  path: iam-service.crt
                - key: iam-service.key
                  path: iam-service.key
                secretName: platform-mesh-certs
            - name: signing-key
              secret:
                secretName: iam-local-signing-key
                defaultMode: 292
  deployment-aiforall-local-full-oauth-idp-simulator:
    category: applications
    object:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oauth-idp-simulator
        namespace: aiforall-local-full
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: oauth-idp-simulator
        template:
          metadata:
            labels:
              app.kubernetes.io/name: oauth-idp-simulator
          spec:
            automountServiceAccountToken: false
            containers:
            - command:
              - python
              - -B
              - /scripts/oauth-idp-simulator.py
              env:
              - name: OAUTH_PROOF_INPUT_FILE
                value: /inputs/provider.json
              image: python:3.12.9-alpine3.21@sha256:28b8a72c4e0704dd2048b79830e692e94ac2d43d30c914d54def6abf74448a4e
              name: provider
              ports:
              - containerPort: 8080
                name: http
              readinessProbe:
                httpGet:
                  path: /observations
                  port: http
                periodSeconds: 5
              resources:
                limits:
                  cpu: 200m
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
              - mountPath: /scripts
                name: script
                readOnly: true
              - mountPath: /inputs
                name: inputs
                readOnly: true
            securityContext:
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            volumes:
            - configMap:
                name: oauth-proof-simulator-mmk62f9gt2
              name: script
            - name: inputs
              secret:
                secretName: oauth-proof-inputs-{{ .Values.runId }}
  deployment-aiforall-local-full-sentinel-sync:
    refreshTarget: sentinel
  networkpolicy-aiforall-local-full-oauth-proof-connector:
    category: foundation
    object:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: oauth-proof-connector
        namespace: aiforall-local-full
      spec:
        egress:
        - ports:
          - port: 8080
            protocol: TCP
          to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: oauth-idp-simulator
        ingress:
        - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: iam
          ports:
          - port: 8443
            protocol: TCP
        podSelector:
          matchLabels:
            app.kubernetes.io/name: gitlab-connect
        policyTypes:
        - Ingress
        - Egress
  networkpolicy-aiforall-local-full-oauth-proof-iam-egress:
    category: foundation
    object:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: oauth-proof-iam-egress
        namespace: aiforall-local-full
      spec:
        egress:
        - ports:
          - port: 8443
            protocol: TCP
          to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: gitlab-connect
        podSelector:
          matchLabels:
            app.kubernetes.io/name: iam
        policyTypes:
        - Egress
  networkpolicy-aiforall-local-full-oauth-proof-provider:
    category: foundation
    object:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: oauth-proof-provider
        namespace: aiforall-local-full
      spec:
        ingress:
        - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: gitlab-connect
          ports:
          - port: 8080
            protocol: TCP
        podSelector:
          matchLabels:
            app.kubernetes.io/name: oauth-idp-simulator
        policyTypes:
        - Ingress
  secret-aiforall-local-full-iam-runtime-template: null
enforcePrincipal: true
principalIssuer: http://127.0.0.1:8080/iam
