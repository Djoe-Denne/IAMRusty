apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: apparatus-knative-strict
  namespace: apparatus-plugins
spec:
  selector:
    matchLabels:
      apparatus.aiforall.dev/runtime: knative
  mtls:
    mode: STRICT
---
# No allow until exact SPIFFE peers and distinct control ports/paths are locked.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: apparatus-knative-quarantine
  namespace: apparatus-plugins
spec:
  selector:
    matchLabels:
      apparatus.aiforall.dev/runtime: knative
  action: ALLOW
  rules: []
