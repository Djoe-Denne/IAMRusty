apiVersion: v1
kind: ResourceQuota
metadata:
  name: apparatus-knative-quarantine
  namespace: apparatus-plugins
spec:
  hard:
    # Zero capacity until lab inventory/lock approval: finite and fail-closed.
    pods: "0"
    requests.cpu: "0"
    requests.memory: "0"
    limits.cpu: "0"
    limits.memory: "0"
    requests.ephemeral-storage: "0"
    limits.ephemeral-storage: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
