apiVersion: v1
kind: ServiceAccount
metadata:
  name: apparatus-runtime-plugin
  namespace: apparatus-plugins
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apparatus-serving-adapter
  namespace: aiforall-apparatus
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apparatus-serving-adapter
  namespace: apparatus-plugins
rules:
  - apiGroups: [serving.knative.dev]
    resources: [services]
    verbs: [create, get, list, watch, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apparatus-serving-adapter
  namespace: apparatus-plugins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apparatus-serving-adapter
subjects:
  - kind: ServiceAccount
    name: apparatus-serving-adapter
    namespace: aiforall-apparatus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apparatus-knative-placement
  namespace: apparatus-system
data:
  systemPool: apparatus.aiforall.dev/pool=system
  pluginPool: apparatus.aiforall.dev/pool=plugins
  scheduling: |
    Node labels/taints and upstream controller/gateway placement are NOT installed
    by this static overlay. Lock must map stack scheduling settings to system pool.
    Plugins tolerate dedicated plugin taint only. Several bindings per node allowed;
    no required pod anti-affinity. Inventory capacity/overhead before E.
    Adapter uses explicit projected API credentials only; no role for children,
    secrets, tokenreviews or nodes is granted here. Observation/enrollment RBAC
    needs separately reviewed C interfaces, never wildcard escalation.
