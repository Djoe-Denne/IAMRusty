# Pods dans apparatus-plugins — copie IT (workers/apparatus-operator/k8s/02-rbac.yaml),
# subject J2 : SA controller / aiforall-apparatus (pas apparatus-controller / apparatus-system).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apparatus-controller-plugins
  namespace: apparatus-plugins
  labels:
    app.kubernetes.io/name: apparatus-operator
    app.kubernetes.io/part-of: aiforall
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apparatus-controller-plugins
  namespace: apparatus-plugins
  labels:
    app.kubernetes.io/name: apparatus-operator
    app.kubernetes.io/part-of: aiforall
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apparatus-controller-plugins
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: aiforall-apparatus
