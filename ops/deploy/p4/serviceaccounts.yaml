# Identités 0601 dans aiforall-apparatus : controller (+ admit-sign, build).
# Pas de ClusterRoleBinding dans cette tranche (pas de privilège cluster).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: aiforall-apparatus
  labels:
    app.kubernetes.io/name: apparatus-operator
    app.kubernetes.io/part-of: aiforall
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admit-sign
  namespace: aiforall-apparatus
  labels:
    app.kubernetes.io/name: apparatus-operator
    app.kubernetes.io/part-of: aiforall
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build
  namespace: aiforall-apparatus
  labels:
    app.kubernetes.io/name: apparatus-operator
    app.kubernetes.io/part-of: aiforall
automountServiceAccountToken: false
