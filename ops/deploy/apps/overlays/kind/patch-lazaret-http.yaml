apiVersion: apps/v1
kind: Deployment
metadata:
  name: lazaret
  namespace: aiforall-gateway
spec:
  template:
    spec:
      containers:
        - name: lazaret
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: lazaret-invoke
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /lazaret/invoke
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: lazaret-invoke
          configMap:
            name: lazaret-invoke-stub
