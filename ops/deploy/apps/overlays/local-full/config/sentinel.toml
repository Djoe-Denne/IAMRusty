[logging]
level = "info"
[openfga]
scheme = "http"
host = "openfga"
port = 8080
store_id = ""
[idempotency]
backend = "postgres"
database_url = "postgres://postgres:postgres@postgres:5432/sentinel_dev"
[queue]
