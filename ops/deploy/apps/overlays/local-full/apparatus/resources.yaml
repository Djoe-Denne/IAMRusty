apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: admission-store}
spec:
  storageClassName: standard
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: apparatus-budget}
spec: {hard: {requests.cpu: "1", requests.memory: 512Mi, limits.cpu: "4", limits.memory: 1Gi, pods: "8", persistentvolumeclaims: "1", requests.storage: 1Gi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-api}
spec:
  podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [apparatus-operator, local-full-admit]}]}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 10.96.0.1/32}}]
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 6443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-local-trust-services}
spec:
  podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [apparatus-operator, local-full-admit]}]}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: aiforall-local-full}}
          podSelector: {matchLabels: {app.kubernetes.io/name: zot}}
      ports: [{protocol: TCP, port: 5000}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: aiforall-local-full}}
          podSelector: {matchLabels: {app.kubernetes.io/name: openbao}}
      ports: [{protocol: TCP, port: 8200}]
