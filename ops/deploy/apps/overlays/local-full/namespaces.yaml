apiVersion: v1
kind: Namespace
metadata:
  name: aiforall-local-full
  labels:
    aiforall.dev/profile: local-full
    aiforall.dev/storage: persistent
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: aiforall-local-apparatus
  labels:
    aiforall.dev/profile: local-full
    aiforall.dev/storage: persistent
    # The existing admission-store ownership init requires CHOWN as root.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: aiforall-local-plugins
  labels:
    aiforall.dev/profile: local-full
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
