# aiforall-platform and aiforall-gateway are default-deny. These policies open
# only the mesh AuthN path: DNS, Postgres, OpenFGA, the four services, Envoy, ext-authz.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mesh-platform
  namespace: aiforall-platform
  labels:
    app.kubernetes.io/part-of: aiforall
    app.kubernetes.io/component: mesh-authn
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["platform", "mesh-authn"]
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector: {}
      ports:
        - port: 5432
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8443
          protocol: TCP
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aiforall-gateway
      ports:
        - port: 5432
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mesh-gateway
  namespace: aiforall-gateway
  labels:
    app.kubernetes.io/part-of: aiforall
    app.kubernetes.io/component: mesh-authn
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mesh-authn
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aiforall-platform
      ports:
        - port: 5432
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8443
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mesh-authn
      ports:
        - port: 8090
          protocol: TCP
        - port: 10000
          protocol: TCP
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mesh-authn
      ports:
        - port: 8090
          protocol: TCP
        - port: 10000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mesh-e2e-apk
  namespace: aiforall-gateway
  labels:
    app.kubernetes.io/part-of: aiforall
    app.kubernetes.io/component: mesh-authn
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mesh-authn-e2e
  policyTypes: ["Egress"]
  egress:
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
