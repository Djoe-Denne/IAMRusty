# Opt-in Envoy HTTP ext_authz wiring (ADR-0308). Manual apply only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-mesh-config
  namespace: aiforall-gateway
  labels:
    app.kubernetes.io/name: envoy-mesh
    app.kubernetes.io/part-of: aiforall
    app.kubernetes.io/component: mesh-authn
data:
  envoy.yaml: |
    # Opt-in mesh. HTTP ext_authz. No Envoy JWT filter. No sidecar.
    # Lua strips every x-principal-* header before ext_authz.
    # allowed_upstream_headers forwards only iss/sub. No path_prefix.
    # failure_mode_allow: false. Client certs required. Certs: secret platform-mesh-certs.
    static_resources:
      listeners:
        - name: listener_mesh
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 10000
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain:
                          filename: /etc/envoy/certs/envoy-mesh.crt
                        private_key:
                          filename: /etc/envoy/certs/envoy-mesh.key
                    validation_context:
                      trusted_ca:
                        filename: /etc/envoy/certs/ca.crt
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: mesh_ingress
                    codec_type: AUTO
                    # IAM S5/S-12 charges the rightmost XFF hop. Append the actual
                    # mTLS downstream socket peer, never a caller-supplied identity.
                    use_remote_address: true
                    xff_num_trusted_hops: 0
                    skip_xff_append: false
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          routes:
                            - match:
                                path: /iam/.well-known/jwks.json
                                headers: [{name: ':method', string_match: {safe_regex: {google_re2: {}, regex: '^(GET|HEAD)$'}}}]
                              route:
                                cluster: iam
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                            - match:
                                path: /iam/api/auth/signup
                                headers: [{name: ':method', string_match: {exact: POST}}]
                              route:
                                cluster: iam
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                            - match:
                                path: /iam/api/auth/login
                                headers: [{name: ':method', string_match: {exact: POST}}]
                              route:
                                cluster: iam
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                            - match:
                                safe_regex:
                                  google_re2: {}
                                  regex: '^/iam/api/auth/(verify|username/check|[^/]+/(login|callback))$'
                                headers: [{name: ':method', string_match: {safe_regex: {google_re2: {}, regex: '^(GET|HEAD)$'}}}]
                              route:
                                cluster: iam
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                            - match:
                                safe_regex:
                                  google_re2: {}
                                  regex: '^/iam/(api/auth/(resend-verification|complete-registration|password/(reset-request|reset-validate|reset-confirm))|api/token/refresh)$'
                                headers: [{name: ':method', string_match: {exact: POST}}]
                              route:
                                cluster: iam
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                            # State/browser-DB authenticated callbacks; deploy with A2 only.
                            - match:
                                path: /iam/api/auth/github/relink-callback
                                headers: [{name: ':method', string_match: {safe_regex: {google_re2: {}, regex: '^(GET|HEAD)$'}}}]
                              route:
                                cluster: iam
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                            - match:
                                path: /iam/api/auth/gitlab/relink-callback
                                headers: [{name: ':method', string_match: {safe_regex: {google_re2: {}, regex: '^(GET|HEAD)$'}}}]
                              route:
                                cluster: iam
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                            - match:
                                prefix: "/iam/"
                              route:
                                cluster: iam
                            - match:
                                prefix: "/hive/"
                              route:
                                cluster: hive
                            - match:
                                prefix: "/telegraph/"
                              route:
                                cluster: telegraph
                            - match:
                                prefix: "/manifesto/"
                              route:
                                cluster: manifesto
                    http_filters:
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code:
                            inline_string: |
                              function envoy_on_request(request_handle)
                                local headers = request_handle:headers()
                                local doomed = {}
                                for key, _ in pairs(headers) do
                                  if string.sub(string.lower(key), 1, 12) == "x-principal-" then
                                    table.insert(doomed, key)
                                  end
                                end
                                for _, key in ipairs(doomed) do
                                  headers:remove(key)
                                end
                              end
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          failure_mode_allow: false
                          http_service:
                            server_uri:
                              uri: https://ext-authz.aiforall-gateway.svc.cluster.local:8090/
                              cluster: ext_authz
                              timeout: 5s
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: authorization
                                  - prefix: x-principal-
                            authorization_response:
                              allowed_upstream_headers:
                                patterns:
                                  - exact: x-principal-iss
                                  - exact: x-principal-sub
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: ext_authz
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: ext-authz.aiforall-gateway.svc.cluster.local
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/envoy-mesh.crt
                    private_key:
                      filename: /etc/envoy/certs/envoy-mesh.key
                validation_context:
                  trusted_ca:
                    filename: /etc/envoy/certs/ca.crt
          load_assignment:
            cluster_name: ext_authz
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: ext-authz.aiforall-gateway.svc.cluster.local
                          port_value: 8090
        - name: iam
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: iam.aiforall-platform.svc.cluster.local
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/envoy-mesh.crt
                    private_key:
                      filename: /etc/envoy/certs/envoy-mesh.key
                validation_context:
                  trusted_ca:
                    filename: /etc/envoy/certs/ca.crt
          load_assignment:
            cluster_name: iam
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: iam.aiforall-platform.svc.cluster.local
                          port_value: 8443
        - name: hive
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: hive.aiforall-platform.svc.cluster.local
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/envoy-mesh.crt
                    private_key:
                      filename: /etc/envoy/certs/envoy-mesh.key
                validation_context:
                  trusted_ca:
                    filename: /etc/envoy/certs/ca.crt
          load_assignment:
            cluster_name: hive
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: hive.aiforall-platform.svc.cluster.local
                          port_value: 8443
        - name: telegraph
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: telegraph.aiforall-platform.svc.cluster.local
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/envoy-mesh.crt
                    private_key:
                      filename: /etc/envoy/certs/envoy-mesh.key
                validation_context:
                  trusted_ca:
                    filename: /etc/envoy/certs/ca.crt
          load_assignment:
            cluster_name: telegraph
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: telegraph.aiforall-platform.svc.cluster.local
                          port_value: 8443
        - name: manifesto
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: manifesto.aiforall-platform.svc.cluster.local
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/envoy-mesh.crt
                    private_key:
                      filename: /etc/envoy/certs/envoy-mesh.key
                validation_context:
                  trusted_ca:
                    filename: /etc/envoy/certs/ca.crt
          load_assignment:
            cluster_name: manifesto
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: manifesto.aiforall-platform.svc.cluster.local
                          port_value: 8443
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-mesh
  namespace: aiforall-gateway
  labels:
    app.kubernetes.io/name: envoy-mesh
    app.kubernetes.io/part-of: aiforall
    app.kubernetes.io/component: mesh-authn
spec:
  selector:
    app.kubernetes.io/name: envoy-mesh
  ports:
    - name: http
      port: 10000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-mesh
  namespace: aiforall-gateway
  labels:
    app.kubernetes.io/name: envoy-mesh
    app.kubernetes.io/part-of: aiforall
    app.kubernetes.io/component: mesh-authn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy-mesh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envoy-mesh
        app.kubernetes.io/part-of: aiforall
        app.kubernetes.io/component: mesh-authn
    spec:
      automountServiceAccountToken: false
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31.2@sha256:c56804e9fc8d5184c45862ad851173a925ff383151cb94156f86bed047da29bc
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          args:
            - -c
            - /etc/envoy/envoy.yaml
            - --log-level
            - info
          ports:
            - name: http
              containerPort: 10000
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
            - name: certs
              mountPath: /etc/envoy/certs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: envoy-mesh-config
        - name: certs
          secret:
            secretName: platform-mesh-certs
