              value: iam-internal-dev-token
            - name: HIVE_IAM_SERVICE__BASE_URL
              value: http://iam.aiforall-platform.svc.cluster.local:8080
            - name: HIVE_SERVER__TLS_REQUIRE_CLIENT_CERT
              value: "true"
            - name: HIVE_AUTH__MESH__TRUSTED_GATEWAY_SAN
