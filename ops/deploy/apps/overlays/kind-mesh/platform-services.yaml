            - name: HIVE_QUEUE__ENABLED
              value: "false"
            - name: HIVE_OPENFGA__STORE_ID
              value: ""
            - name: HIVE_OPENFGA__AUTHORIZATION_MODEL_ID
              value: ""
          ports:
