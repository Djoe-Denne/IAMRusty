              mountPath: /app/config/development.toml
              subPath: development.toml
            - name: certs
              mountPath: /app/certs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: hive-dev-config
        - name: certs
          secret:
            secretName: platform-mesh-certs
            items:
              - key: ca.crt
                path: ca.crt
              - key: hive-service.crt
                path: hive-service.crt
              - key: hive-service.key
                path: hive-service.key
