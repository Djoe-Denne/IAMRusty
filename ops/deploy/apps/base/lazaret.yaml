# Lazaret = gateway P3 (0004/0007), PAS Factory/host UI (P5/P6).
# Chemin plateforme : GET/POST /lazaret/invoke (SERVICE_PREFIX + INVOKE_PATH).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lazaret
  namespace: aiforall-gateway
  labels:
    app.kubernetes.io/name: lazaret
    app.kubernetes.io/part-of: aiforall
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lazaret
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lazaret
        app.kubernetes.io/part-of: aiforall
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      containers:
        - name: lazaret
          image: registry.k8s.io/pause:3.10
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: lazaret
  namespace: aiforall-gateway
  labels:
    app.kubernetes.io/name: lazaret
    app.kubernetes.io/part-of: aiforall
spec:
  selector:
    app.kubernetes.io/name: lazaret
  ports:
    - name: http
      port: 8080
      targetPort: http
