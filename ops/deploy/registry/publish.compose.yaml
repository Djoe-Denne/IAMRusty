services:
  publisher:
    profiles: [transport]
    image: quay.io/skopeo/stable@sha256:35bf578e3fa75a1f23bbec819fc1bd9745eacb4a0594dea203e426da66e95e5a
    platform: linux/amd64
    pull_policy: never
    container_name: ${REGISTRY_PROJECT:?}-publisher
    labels:
      aiforall.registry.owner: ${REGISTRY_OWNER:?}
      aiforall.registry.role: publisher
    user: ${REGISTRY_USER:?}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    environment: {TMPDIR: /outputs/tmp}
    entrypoint: [/bin/sh, /scripts/publish.sh]
    networks: [registry]
    volumes:
      - type: bind
        source: ./policy.json
        target: /scripts/policy.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./publish.sh
        target: /scripts/publish.sh
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REGISTRY_INPUTS:?}
        target: /inputs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REGISTRY_OUTPUTS:?}
        target: /outputs
        bind: {create_host_path: false}
      - type: bind
        source: ${REGISTRY_CERTS:?}/mesh/ca.crt
        target: /certs/ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REGISTRY_CERTS:?}/extensions/registry/registry-publisher.crt
        target: /certs/client.cert
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REGISTRY_CERTS:?}/extensions/registry/registry-publisher.key
        target: /certs/client.key
        read_only: true
        bind: {create_host_path: false}
networks:
  registry:
    external: true
    name: ${REGISTRY_NETWORK:?}
