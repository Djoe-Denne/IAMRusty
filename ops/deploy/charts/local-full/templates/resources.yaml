{{- $root := . -}}
{{- $phase := .Values.phase -}}
{{- if eq .Values.storage.mode "none" -}}
{{- $identities := dict -}}
{{- $scopes := dict -}}
{{- range $declaration := .Values.resources -}}
{{- if and $declaration $declaration.migrationScope -}}
{{- if hasKey $scopes $declaration.migrationScope -}}{{- fail "two declared workloads write the same migration scope" -}}{{- end -}}
{{- $_ := set $scopes $declaration.migrationScope true -}}
{{- end -}}
{{- end -}}
{{- range $key, $declaration := .Values.resources -}}
{{- if $declaration -}}
{{- $category := $declaration.category -}}
{{- $applicationPhase := and (eq $category "applications") (has $phase (list "quiesce" "applications-first")) -}}
{{- if or (eq $phase "final") (eq $phase $category) $applicationPhase -}}
{{- $object := tpl (toYaml $declaration.object) $root | fromYaml -}}
{{- $annotations := default (dict) $object.metadata.annotations -}}
{{- $_ := set $annotations "aiforall.dev/category" $category -}}
{{- $_ := set $annotations "aiforall.dev/declaration" $key -}}
{{- if $declaration.epoch -}}
{{- $_ := set $annotations "aiforall.dev/epoch-initializer" $declaration.epoch -}}
{{- end -}}
{{- if $declaration.coffer -}}
{{- $_ := set $annotations "aiforall.dev/coffer" "true" -}}
{{- end -}}
{{- if $declaration.seed -}}
{{- $_ := set $annotations "aiforall.dev/seed" $declaration.seed -}}
{{- end -}}
{{- if $declaration.refreshTarget -}}
{{- $_ := set $annotations "aiforall.dev/refresh-target" $declaration.refreshTarget -}}
{{- end -}}
{{- if $declaration.migrationScope -}}
{{- $_ := set $annotations "aiforall.dev/migration-scope" $declaration.migrationScope -}}
{{- end -}}
{{- if $declaration.persistence -}}
{{- $_ := set $annotations "aiforall.dev/persistence" (toJson $declaration.persistence) -}}
{{- end -}}
{{- if $declaration.privateFiles -}}
{{- $_ := set $annotations "aiforall.dev/private-files" (toJson $declaration.privateFiles) -}}
{{- end -}}
{{- $_ := set $object.metadata "annotations" $annotations -}}
{{- if hasKey $declaration "files" -}}
{{- $data := dict -}}
{{- range $field, $path := $declaration.files -}}
{{- $content := $root.Files.Get $path -}}
{{- if or (hasSuffix ".toml" $path) (hasSuffix "/envoy.yaml" $path) (hasSuffix "/ca.crt" $path) (hasSuffix "/provider.json" $path) -}}
{{- $content = tpl $content $root -}}
{{- end -}}
{{- $_ := set $data $field $content -}}
{{- end -}}
{{- if hasKey $declaration.files "seed-openbao.sh" -}}
{{- $bootstrap := $root.Files.Get "files/openbao/bootstrap.json" | fromJson -}}
{{- range $name, $policy := $bootstrap.policies -}}
{{- $_ := set $data (printf "openbao-policy-%s.hcl" $name) $policy -}}
{{- end -}}
{{- range $name, $role := $bootstrap.roles -}}
{{- $_ := set $data (printf "openbao-role-%s.json" $name) (toJson $role) -}}
{{- end -}}
{{- range $name, $mount := $bootstrap.mounts -}}
{{- $_ := set $data (printf "openbao-mount-%s.json" $name) (toJson $mount) -}}
{{- end -}}
{{- range $name, $method := $bootstrap.auth -}}
{{- $_ := set $data (printf "openbao-auth-%s.json" $name) (toJson $method) -}}
{{- end -}}
{{- range $name, $request := $bootstrap.requests -}}
{{- $_ := set $data (printf "openbao-request-%s.json" $name) (toJson $request.body) -}}
{{- $_ := set $data (printf "openbao-request-%s.path" $name) $request.path -}}
{{- end -}}
{{- $args := list -}}
{{- range $name, $value := $bootstrap.authConfig.fields -}}
{{- if kindIs "map" $value -}}
{{- $args = append $args (printf "%s=@%s" $name $value.file) -}}
{{- else -}}
{{- $args = append $args (printf "%s=%v" $name $value) -}}
{{- end -}}
{{- end -}}
{{- $_ := set $data "openbao-auth-config.args" (printf "%s\n" (join "\n" $args)) -}}
{{- $_ := set $data "openbao-auth-config.path" $bootstrap.authConfig.path -}}
{{- end -}}
{{- $_ := set $object "data" $data -}}
{{- end -}}
{{- if eq $object.kind "Deployment" -}}
{{- $pod := $object.spec.template.spec -}}
{{- if and $root.Values.enforcePrincipal $declaration.principalPrefix -}}
{{- $app := first $pod.containers -}}
{{- $_ := set $app "env" (concat (default (list) $app.env) (list (dict "name" (printf "%s__PLATFORM_ISSUER" $declaration.principalPrefix) "value" $root.Values.principalIssuer) (dict "name" (printf "%s__ALLOW_HISTORICAL_PLATFORM_ISSUER" $declaration.principalPrefix) "value" "false"))) -}}
{{- end -}}
{{- range $volume := $pod.volumes -}}
{{- if and $volume.secret (hasKey $root.Values.secretRefs $volume.secret.secretName) -}}
{{- $_ := set $volume.secret "secretName" (index $root.Values.secretRefs $volume.secret.secretName) -}}
{{- end -}}
{{- end -}}
{{- if $applicationPhase -}}
{{- $_ := set $object.spec "replicas" (ternary 0 1 (eq $phase "quiesce")) -}}
{{- end -}}
{{- $podAnnotations := default (dict) $object.spec.template.metadata.annotations -}}
{{- $_ := set $podAnnotations "aiforall.dev/config-sha256" (printf "%s%s%s%s" (toJson (omit $root.Values "phase" "storage")) ($root.Files.Glob "files/public/**" | toJson) ($root.Files.Glob "files/config/**" | toJson) ($root.Files.Glob "files/openbao/**" | toJson) | sha256sum) -}}
{{- $_ := set $object.spec.template.metadata "annotations" $podAnnotations -}}
{{- range $container := concat (default (list) $pod.containers) (default (list) $pod.initContainers) -}}
{{- if hasPrefix "aiforall-" $container.image -}}
{{- if $root.Values.images -}}
{{- $image := required (printf "immutable image mapping missing: %s" $container.image) (index $root.Values.images $container.image) -}}
{{- $_ := set $container "image" $image -}}
{{- if contains "@sha256:" $image -}}{{- $_ := set $container "imagePullPolicy" "IfNotPresent" -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and $root.Values.isolatedPlugins (eq $object.metadata.name "lazaret") -}}
{{- $app := first $pod.containers -}}
{{- $_ := set $app "env" (concat (default (list) $app.env) (list (dict "name" "LAZARET_PLUGIN_HOP__USE_DNS_FORMULA" "value" "true") (dict "name" "LAZARET_PLUGIN_HOP__NAMESPACE" "value" "aiforall-local-plugins"))) -}}
{{- end -}}
{{- if and $root.Values.isolatedPlugins (eq $object.metadata.name "apparatus-operator") -}}
{{- $app := first $pod.containers -}}
{{- $_ := set $app "env" (concat (default (list) $app.env) (list (dict "name" "APPARATUS_PLUGIN_CA_SECRET" "value" "lazaret-workload-ca") (dict "name" "APPARATUS_PLUGIN_CA_SHA256" "value" $root.Values.pluginCaSha256))) -}}
{{- end -}}
{{- end -}}
{{- if and (eq $object.kind "NetworkPolicy") (eq $object.metadata.name "allow-api") -}}
{{- if $root.Values.network.apiCidr -}}
{{- $_ := set (first $object.spec.egress) "to" (append (first $object.spec.egress).to (dict "ipBlock" (dict "cidr" $root.Values.network.apiCidr))) -}}
{{- else -}}
{{- $_ := set (first $object.spec.egress) "to" (list (first (first $object.spec.egress).to)) -}}
{{- end -}}
{{- end -}}
{{- if and (eq $object.kind "NetworkPolicy") (eq $object.metadata.name "allow-envoy") $root.Values.network.ingressCidr -}}
{{- $_ := set $object.spec "ingress" (append $object.spec.ingress (dict "from" (list (dict "ipBlock" (dict "cidr" $root.Values.network.ingressCidr))) "ports" (list (dict "protocol" "TCP" "port" 10000)))) -}}
{{- end -}}
{{- include "local-full.validate" (dict "root" $root "object" $object "declaration" $declaration "identities" $identities) }}
---
{{ toYaml $object }}
{{ end -}}
{{- end -}}
{{- end -}}
{{- end -}}
