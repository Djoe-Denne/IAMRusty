# Public lifecycle/epoch contract. Consumers themselves declare epoch-initializer.
profiles:
  base:
    identities: []
    inputs: {}
    endpoint: http://127.0.0.1:18080
  gitlab-proof:
    identities:
      - {kind: Deployment, namespace: aiforall-local-full, name: gitlab-connect}
    inputs: {}
    endpoint: http://127.0.0.1:18080
  github-openbao:
    identities:
      - {kind: Deployment, namespace: aiforall-local-full, name: github-connect}
    seedContract: github-openbao
    endpoint: http://127.0.0.1:18080
    inputs:
      github_input:
        - {kind: ConfigMap, name: github-openbao-config, key: development.toml, format: toml, path: [github, client_id]}
  oauth-connect:
    identities:
      - {kind: Deployment, namespace: aiforall-local-full, name: oauth-connect}
    seedContract: oauth-connect
    endpoint: https://127.0.0.1:18080
    inputs:
      github_input:
        - {kind: ConfigMap, name: oauth-connect-config, key: development.toml, format: toml, path: [providers, 0, client_id]}
      simulated_input:
        - {kind: ConfigMap, name: oauth-connect-config, key: development.toml, format: toml, path: [providers, 1, client_id]}
        - {kind: ConfigMap, name: oauth-simulator-config, key: provider.json, format: json, path: [client_id]}
