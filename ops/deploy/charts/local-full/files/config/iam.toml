# Explicit local-only credentials/key. No enabled external OAuth connector.
[security]
mode = "local_insecure"
# Envoy pods have dynamic IPs in the pinned Kind/Calico pod network.
# Network match alone is insufficient: IAM also requires the verified envoy-mesh TLS SAN.
[[security.rate_limit.trusted_proxies]]
ip = "10.244.0.0"
prefix_len = 16
dns_san = "envoy-mesh"
[server]
host = "0.0.0.0"
port = 8080
tls_enabled = true
tls_port = 8443
tls_cert_path = "/app/certs/iam-service.crt"
tls_key_path = "/app/certs/iam-service.key"
tls_client_ca_path = "/app/certs/ca.crt"
[auth.jwt]
platform_issuer = "{{ if eq .Values.profile "oauth-connect" }}https://127.0.0.1:18080/iam{{ else }}http://127.0.0.1:8080/iam{{ end }}"
allow_historical_platform_issuer = false
audience = "aiforall"
jwks_url = "http://iam:8080/iam/.well-known/jwks.json"
allowed_algorithms = ["RS256"]
[database]
host = "postgres"
port = 5432
db = "iam_dev"
[database.creds]
username = "postgres"
password = "postgres"
[idp]
{{ if eq .Values.profile "base" }}
connectors = []
{{ else if eq .Values.profile "gitlab-proof" }}
[[idp.connectors]]
id = "gitlab"
base_url = "https://gitlab-connect:8443/gitlab-connect"
hmac_secret = "__OAUTH_PROOF_HMAC__"
pkce_supported = true
redirect_uris = ["http://127.0.0.1:18080/iam/api/auth/gitlab/callback", "http://127.0.0.1:18080/iam/api/auth/gitlab/relink-callback"]
{{ else if eq .Values.profile "github-openbao" }}
[[idp.connectors]]
id = "github"
base_url = "https://github-connect:8443/github-connect"
hmac_secret = "__GITHUB_OPENBAO_HMAC__"
pkce_supported = false
redirect_uris = ["http://127.0.0.1:18080/iam/api/auth/github/callback", "http://127.0.0.1:18080/iam/api/auth/github/relink-callback"]
{{ else }}
{{ range $slug := list "github" "simulated" }}
[[idp.connectors]]
id = "{{ $slug }}"
base_url = "https://oauth-connect:8443/oauth-connect/{{ $slug }}"
hmac_secret = "__{{ $slug | upper }}_OPENBAO_HMAC__"
pkce_supported = {{ ne $slug "github" }}
redirect_uris = ["https://127.0.0.1:18080/iam/api/auth/{{ $slug }}/callback", "https://127.0.0.1:18080/iam/api/auth/{{ $slug }}/relink-callback"]
{{ end }}
{{ end }}
[jwt]
expiration_seconds = 900
refresh_token_expiration_seconds = 2592000
issuer = "{{ if eq .Values.profile "oauth-connect" }}https://127.0.0.1:18080/iam{{ else }}http://127.0.0.1:8080/iam{{ end }}"
audience = "aiforall"
public_base_url = "{{ if eq .Values.profile "oauth-connect" }}https://127.0.0.1:18080{{ else }}http://127.0.0.1:8080{{ end }}"
jwks_url = "http://iam:8080/iam/.well-known/jwks.json"
allowed_algorithms = ["RS256"]
oauth_state_secret = "{{ if eq .Values.profile "gitlab-proof" }}__OAUTH_PROOF_STATE__{{ else }}__LOCAL_OAUTH_STATE__{{ end }}"
[jwt.secret]
type = "pem_file"
private_key_path = "config/keys/test-platform.pem"
public_key_path = "config/keys/test-platform.pub"
key_id = "66c446d36eca4740a5f5ce29057fad3b"
[logging]
level = "info"
[command.retry]
max_attempts = 0
base_delay_ms = 50
max_delay_ms = 5000
backoff_multiplier = 2.0
use_jitter = false
[queue]
type = "sqs"
enabled = true
region = "us-east-1"
account_id = "000000000000"
default_queues = ["telegraph-events"]
host = "localstack"
port = 4566
access_key_id = "test"
secret_access_key = "test"
max_retries = 3
timeout_seconds = 30
[queue.queues]
user_signed_up = ["telegraph-events", "sentinel-sync-events"]
user_email_verified = ["telegraph-events", "sentinel-sync-events"]
password_reset_requested = ["telegraph-events"]
