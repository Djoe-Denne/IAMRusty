static_resources:
  listeners:
  - name: listener_mesh
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    -
{{ if eq .Values.profile "oauth-connect" }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          require_client_certificate: false
          common_tls_context:
            tls_certificates:
            - certificate_chain:
                filename: /etc/envoy/certs/envoy-mesh.crt
              private_key:
                filename: /etc/envoy/certs/envoy-mesh.key
{{ end }}
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: mesh_ingress
          codec_type: AUTO
          use_remote_address: true
          xff_num_trusted_hops: 0
          skip_xff_append: false
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains:
              - '*'
              routes:
              - match:
                  path: /iam/.well-known/jwks.json
                  headers:
                  - name: :method
                    string_match:
                      safe_regex:
                        google_re2: {}
                        regex: ^(GET|HEAD)$
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match:
                  path: /iam/api/auth/signup
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match:
                  path: /iam/api/auth/login
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match:
                  safe_regex:
                    google_re2: {}
                    regex: ^/iam/api/auth/(verify|username/check|[^/]+/(login|callback))$
                  headers:
                  - name: :method
                    string_match:
                      safe_regex:
                        google_re2: {}
                        regex: ^(GET|HEAD)$
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match:
                  path: /iam/api/auth/resend-verification
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match:
                  path: /iam/api/auth/complete-registration
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match:
                  path: /iam/api/auth/password/reset-request
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match:
                  path: /iam/api/auth/password/reset-validate
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match:
                  path: /iam/api/auth/password/reset-confirm
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match:
                  path: /iam/api/token/refresh
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
{{ if eq .Values.profile "gitlab-proof" }}
              - match:
                  path: /iam/api/auth/gitlab/relink-callback
                  headers:
                  - name: :method
                    string_match:
                      safe_regex:
                        google_re2: {}
                        regex: ^(GET|HEAD)$
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
{{ end }}
{{ if eq .Values.profile "oauth-connect" }}
              - match:
                  path: /iam/api/auth/simulated/relink-callback
                  headers:
                  - name: :method
                    string_match:
                      safe_regex:
                        google_re2: {}
                        regex: ^(GET|HEAD)$
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
{{ end }}
{{ if has .Values.profile (list "github-openbao" "oauth-connect") }}
              - match:
                  path: /iam/api/auth/github/relink-callback
                  headers:
                  - name: :method
                    string_match:
                      safe_regex:
                        google_re2: {}
                        regex: ^(GET|HEAD)$
                route:
                  cluster: iam
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
{{ end }}
              - match:
                  prefix: /iam/
                route:
                  cluster: iam
              - match:
                  prefix: /hive/
                route:
                  cluster: hive
              - match:
                  prefix: /telegraph/
                route:
                  cluster: telegraph
              - match:
                  prefix: /manifesto/
                route:
                  cluster: manifesto
          http_filters:
          - name: envoy.filters.http.lua
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: "function envoy_on_request(request_handle)\n  local\
                  \ headers = request_handle:headers()\n  local doomed = {}\n  for\
                  \ key, _ in pairs(headers) do\n    if string.sub(string.lower(key),\
                  \ 1, 12) == \"x-principal-\" then\n      table.insert(doomed, key)\n\
                  \    end\n  end\n  for _, key in ipairs(doomed) do\n    headers:remove(key)\n\
                  \  end\nend\n"
          - name: envoy.filters.http.ext_authz
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              failure_mode_allow: false
              http_service:
                server_uri:
                  uri: https://ext-authz.aiforall-local-full.svc.cluster.local:8090/
                  cluster: ext_authz
                  timeout: 5s
                authorization_request:
                  allowed_headers:
                    patterns:
                    - exact: authorization
                    - prefix: x-principal-
                authorization_response:
                  allowed_upstream_headers:
                    patterns:
                    - exact: x-principal-iss
                    - exact: x-principal-sub
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: ext_authz
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: ext-authz.aiforall-local-full.svc.cluster.local
        common_tls_context:
          tls_certificates:
          - certificate_chain:
              filename: /etc/envoy/certs/envoy-mesh.crt
            private_key:
              filename: /etc/envoy/certs/envoy-mesh.key
          validation_context:
            trusted_ca:
              filename: /etc/envoy/certs/ca.crt
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher:
                exact: ext-authz.aiforall-local-full.svc.cluster.local
    load_assignment:
      cluster_name: ext_authz
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ext-authz.aiforall-local-full.svc.cluster.local
                port_value: 8090
  - name: iam
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: iam.aiforall-local-full.svc.cluster.local
        common_tls_context:
          tls_certificates:
          - certificate_chain:
              filename: /etc/envoy/certs/envoy-mesh.crt
            private_key:
              filename: /etc/envoy/certs/envoy-mesh.key
          validation_context:
            trusted_ca:
              filename: /etc/envoy/certs/ca.crt
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher:
                exact: iam.aiforall-local-full.svc.cluster.local
    load_assignment:
      cluster_name: iam
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: iam.aiforall-local-full.svc.cluster.local
                port_value: 8443
  - name: hive
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: hive.aiforall-local-full.svc.cluster.local
        common_tls_context:
          tls_certificates:
          - certificate_chain:
              filename: /etc/envoy/certs/envoy-mesh.crt
            private_key:
              filename: /etc/envoy/certs/envoy-mesh.key
          validation_context:
            trusted_ca:
              filename: /etc/envoy/certs/ca.crt
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher:
                exact: hive.aiforall-local-full.svc.cluster.local
    load_assignment:
      cluster_name: hive
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: hive.aiforall-local-full.svc.cluster.local
                port_value: 8443
  - name: telegraph
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: telegraph.aiforall-local-full.svc.cluster.local
        common_tls_context:
          tls_certificates:
          - certificate_chain:
              filename: /etc/envoy/certs/envoy-mesh.crt
            private_key:
              filename: /etc/envoy/certs/envoy-mesh.key
          validation_context:
            trusted_ca:
              filename: /etc/envoy/certs/ca.crt
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher:
                exact: telegraph.aiforall-local-full.svc.cluster.local
    load_assignment:
      cluster_name: telegraph
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: telegraph.aiforall-local-full.svc.cluster.local
                port_value: 8443
  - name: manifesto
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: manifesto.aiforall-local-full.svc.cluster.local
        common_tls_context:
          tls_certificates:
          - certificate_chain:
              filename: /etc/envoy/certs/envoy-mesh.crt
            private_key:
              filename: /etc/envoy/certs/envoy-mesh.key
          validation_context:
            trusted_ca:
              filename: /etc/envoy/certs/ca.crt
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher:
                exact: manifesto.aiforall-local-full.svc.cluster.local
    load_assignment:
      cluster_name: manifesto
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: manifesto.aiforall-local-full.svc.cluster.local
                port_value: 8443
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
