{{- if .Values.openfga.create }}
apiVersion: v1
kind: Service
metadata: {name: openfga, namespace: {{ .Release.Namespace }}}
spec:
  selector: {app.kubernetes.io/name: openfga}
  ports: [{name: https, port: 8080, targetPort: https}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: openfga, namespace: {{ .Release.Namespace }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: openfga}
  template:
    metadata:
      labels: {app.kubernetes.io/name: openfga, aiforall.dev/kind-minimal: "true"}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      initContainers:
        - name: migrate
          image: {{ .Values.openfga.image | quote }}
          args: [migrate]
          env:
            - {name: OPENFGA_DATASTORE_ENGINE, value: postgres}
            - name: OPENFGA_DATASTORE_URI
              valueFrom: {secretKeyRef: {name: {{ .Values.openfga.datastoreSecret }}, key: uri}}
          volumeMounts: [{name: tls, mountPath: /tls, readOnly: true}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      containers:
        - name: openfga
          image: {{ .Values.openfga.image | quote }}
          args: [run]
          env:
            - {name: OPENFGA_DATASTORE_ENGINE, value: postgres}
            - name: OPENFGA_DATASTORE_URI
              valueFrom: {secretKeyRef: {name: {{ .Values.openfga.datastoreSecret }}, key: uri}}
            - {name: OPENFGA_HTTP_ADDR, value: "0.0.0.0:8080"}
            - {name: OPENFGA_HTTP_TLS_ENABLED, value: "true"}
            - {name: OPENFGA_HTTP_TLS_CERT, value: /tls/tls.crt}
            - {name: OPENFGA_HTTP_TLS_KEY, value: /tls/tls.key}
            - {name: OPENFGA_GRPC_ADDR, value: "127.0.0.1:8081"}
            - {name: OPENFGA_GRPC_TLS_ENABLED, value: "true"}
            - {name: OPENFGA_GRPC_TLS_CERT, value: /tls/tls.crt}
            - {name: OPENFGA_GRPC_TLS_KEY, value: /tls/tls.key}
            - {name: SSL_CERT_FILE, value: /tls/ca.crt}
            - {name: OPENFGA_PLAYGROUND_ENABLED, value: "false"}
            - {name: OPENFGA_METRICS_ENABLED, value: "false"}
          ports: [{name: https, containerPort: 8080}]
          readinessProbe:
            httpGet: {scheme: HTTPS, path: /healthz, port: https}
            periodSeconds: 5
          volumeMounts: [{name: tls, mountPath: /tls, readOnly: true}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: "1", memory: 256Mi}}
      volumes:
        - name: tls
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.openfga.tlsSecret }}
                  items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
              - secret:
                  name: {{ .Values.openfga.caSecret }}
                  items: [{key: ca.crt, path: ca.crt}]
{{- end }}
