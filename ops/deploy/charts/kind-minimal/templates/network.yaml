{{- if .Values.network.create }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: kind-local-native-ingress, namespace: {{ .Release.Namespace }}}
spec:
  # Never changes the ingress policy of an untouched legacy data Pod/coffer.
  podSelector:
    matchLabels: {aiforall.dev/kind-minimal: "true"}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: aiforall-local-apparatus}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: aiforall-local-plugins}
{{- end }}
