{{- if .Values.postgres.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: aiforall
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.postgres.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kind-local-postgres-tls
  namespace: {{ .Release.Namespace }}
data:
  pg_hba.conf: |
    # Unix socket is local to the server Pod. Every network connection uses TLS.
    local all all trust
    hostnossl all all 0.0.0.0/0 reject
    hostnossl all all ::/0 reject
    hostssl all all 0.0.0.0/0 scram-sha-256
    hostssl all all ::/0 scram-sha-256
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: aiforall
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres-tls
      port: 5432
      targetPort: postgres-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: aiforall
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: data
        aiforall.dev/kind-minimal: "true"
        app.kubernetes.io/part-of: aiforall
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/tls/tls.crt
            - -c
            - ssl_key_file=/tls/tls.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - password_encryption=scram-sha-256
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD_FILE
              value: /run/postgres/password
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGHOST
              value: postgres.{{ .Release.Namespace }}.svc.cluster.local
            # Connect locally before Ready/Service endpoints exist, while libpq
            # still verifies the DNS SAN from PGHOST (host != hostaddr).
            - name: PGHOSTADDR
              value: "127.0.0.1"
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /tls/ca.crt
            - name: PGCONNECT_TIMEOUT
              value: "5"
          ports:
            - name: postgres-tls
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - export PGPASSWORD="$(cat /run/postgres/password)"; exec psql --no-password --no-psqlrc --tuples-only --command='SELECT 1' >/dev/null
            periodSeconds: 5
            timeoutSeconds: 8
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/postgresql
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: credentials
              mountPath: /run/postgres
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: config
          configMap:
            name: kind-local-postgres-tls
        - name: credentials
          secret:
            secretName: {{ .Values.postgres.credentialsSecret }}
            defaultMode: 0440
            items:
              - key: password
                path: password
        - name: tls
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.postgres.tlsSecret }}
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              - secret:
                  name: {{ .Values.postgres.caSecret }}
                  items:
                    - key: ca.crt
                      path: ca.crt
{{- end }}
