# Canary HTTP apparatus-system (T11) : preuve NetworkPolicy, pas un binaire admit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apparatus-system-canary
  namespace: apparatus-system
  labels:
    app: apparatus-system-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apparatus-system-canary
  template:
    metadata:
      labels:
        app: apparatus-system-canary
    spec:
      automountServiceAccountToken: false
      containers:
        - name: canary
          image: apparatus-p4-platform-plugin:t10
          imagePullPolicy: Never
          command: ["httpd", "-f", "-p", "8080"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: apparatus-system-canary
  namespace: apparatus-system
spec:
  selector:
    app: apparatus-system-canary
  ports:
    - name: http
      port: 8080
      targetPort: 8080
